<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Print Finder</title>
<style>
:root{
  --bg:#f6f4ef;--panel:#fffdf8;--ink:#1d1b18;--muted:#6f6a61;--line:#e3ded3;
  --accent:#2f5d50;--accent-ink:#fff;--ok:#2f7a4a;--ok-bg:#e3f1e7;--warn:#855b00;--warn-bg:#fbf0d6;
  --bad:#a33b2b;--bad-bg:#f7e1dc;--chip:#efebe2;--gold:#a87400;
  color-scheme:light;accent-color:var(--accent);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151413;--panel:#1d1c1a;--ink:#ece8df;--muted:#a19b90;--line:#33302b;
  --accent:#7fb8a5;--accent-ink:#10201b;--ok:#86cf9e;--ok-bg:#1f3326;--warn:#e7c06b;--warn-bg:#382e17;
  --bad:#ef9a8a;--bad-bg:#3a201b;--chip:#2a2825;--gold:#e3b04b;
  color-scheme:dark;}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:20px 20px 0;max-width:1400px;margin:0 auto}
h1{font:600 22px/1.2 Georgia,"Times New Roman",serif;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 16px}
.wrap{max-width:1400px;margin:0 auto;padding:0 20px 90px} /* bottom room so the floating Boards button doesn't cover the last row */
form{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
label{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
input,select,button{font:inherit;color:var(--ink)}
input[type=text],input[type=number],select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:38px;font-size:15px;font-weight:400;letter-spacing:0}
@media (max-width:760px){input[type=text],input[type=number],select{font-size:16px}} /* under 16px, iPhones zoom into the page on focus */
#q{width:min(420px,100%)}
input[type=number]{width:96px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 18px;font-weight:600;cursor:pointer;min-height:38px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);border:1px solid transparent;border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;white-space:nowrap}
.chip:hover{border-color:var(--muted)}
.srcbox>summary,.settings>summary{cursor:pointer;font-size:13px;font-weight:600;width:max-content}
.srcs{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:13px;margin-top:10px}
.srcs label{display:flex;align-items:center;gap:6px;color:var(--ink);font-weight:500;letter-spacing:0}
.settings{font-size:12px;color:var(--muted)}
.need{font-size:13px;color:var(--muted)}
.need b{color:var(--ink)}
#status{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 10px;font-size:13px;color:var(--muted);align-items:center;scroll-margin-top:12px}
.st{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.st.err{color:var(--bad);border-color:var(--bad)}
button.st{font-size:13px;cursor:pointer}
button.st:hover{border-color:var(--muted)}
.st.on,.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#tools .chips{align-self:end}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(220px,calc(50% - 7px)),1fr));gap:14px} /* two columns on phones */
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer}
.card:hover,.card:focus-within{border-color:var(--muted)}
.thumb{aspect-ratio:1/1;background:var(--chip);display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.thumb:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.thumb img{max-width:100%;max-height:100%;object-fit:contain}
.nothumb{position:absolute;left:8px;right:8px;bottom:8px;background:var(--panel);color:var(--muted);border-radius:6px;font-size:12px;padding:6px 8px;text-align:center}
img.lqip{width:100%;height:100%;max-height:none;object-fit:contain;filter:blur(7px);opacity:.9} /* the museum's tiny colour sketch, when its server blocks the real preview */
.maxa{padding:8px 12px 0;font:600 17px/1.2 Georgia,"Times New Roman",serif;display:flex;flex-wrap:wrap;align-items:baseline;column-gap:8px}
.maxa span{font:12px/1.2 ui-sans-serif,system-ui,sans-serif;color:var(--muted)}
.meta{padding:6px 12px 12px;display:grid;gap:6px;font-size:13px;flex:1;align-content:start}
.t{font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.a{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badges{display:flex;flex-wrap:wrap;gap:4px}
.b{font-size:11px;font-weight:600;border-radius:5px;padding:2px 6px;background:var(--chip);color:var(--muted)}
.b.ok{background:var(--ok-bg);color:var(--ok)}.b.warn{background:var(--warn-bg);color:var(--warn)}.b.bad{background:var(--bad-bg);color:var(--bad)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.acts button{background:none;border:1px solid var(--line);border-radius:999px;font-size:12px;cursor:pointer;color:var(--muted);padding:0 11px;min-height:30px}
.acts button:hover{color:var(--ink);border-color:var(--muted)}
.acts .star.on{color:var(--gold);border-color:var(--gold)}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.more{color:var(--muted);text-align:center;padding:24px 0 8px;display:grid;justify-items:center;gap:10px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:0;width:min(1000px,94vw);max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.55)}
.x{position:sticky;top:8px;float:right;margin:8px 8px -40px 0;background:var(--panel);border:1px solid var(--line);border-radius:999px;width:32px;height:32px;cursor:pointer;font-size:16px;z-index:4} /* stays reachable while a long dialog scrolls */
.dlg{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}
.dimg{background:var(--chip);display:flex;align-items:center;justify-content:center;min-height:300px;max-height:80vh;position:relative;overflow:hidden}
.dimg img{max-width:100%;max-height:80vh;object-fit:contain}
.dinfo{padding:18px;display:grid;gap:10px;align-content:start;font-size:14px;overflow:auto;max-height:86vh}
.dinfo>*{min-width:0} /* the 100% crop is wider than the column: it scrolls inside its box instead of stretching the panel */
.dinfo h2{font:600 19px/1.25 Georgia,serif;margin:0;padding-right:36px}
@media (max-width:900px){.dlg{grid-template-columns:1fr}.dimg{min-height:200px;max-height:60vh}.dimg img{max-height:60vh}.dinfo{max-height:none;overflow:visible}}
/* print tools: crop frame over the picture, wall preview in its place */
.cropframe{position:absolute;outline:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.55),0 0 0 9999px rgba(0,0,0,.45);cursor:move;touch-action:none}
.cropframe:focus-visible{outline:3px solid var(--accent)}
.dimg.walling{align-items:stretch}
.dimg.walling img{display:none}
.wall{width:100%;display:flex;align-items:flex-end;justify-content:center} /* floor on the bottom edge, wall colour above */
.scene{position:relative;width:min(100%,calc(78vh * var(--ar)));aspect-ratio:var(--ar)}
@media (max-width:900px){.scene{width:min(100%,calc(58vh * var(--ar)))}
  /* phones: while a tool is open the picture stays pinned at the top and the controls scroll beneath it */
  .dlg.tooling .dimg{position:sticky;top:0;z-index:3;min-height:0;max-height:45vh;box-shadow:0 2px 10px rgba(0,0,0,.2)}
  .dlg.tooling .dimg img{max-height:45vh}
  .dlg.tooling .scene{width:min(100%,calc(43vh * var(--ar)))}
  #tool{scroll-margin-top:calc(45vh + 8px)}}
.scene>*{position:absolute}
.scene .art{box-shadow:0 6px 18px rgba(0,0,0,.3)}
.scene .mount,.scene .pic{position:absolute}
.scene .mount{background:#fbfaf7}
.scene .pic{background-color:#fff;background-position:center;background-repeat:no-repeat}
.scene .floor{left:0;right:0;bottom:0}
#tool:empty{display:none}
#tool{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:10px}
#tool h3{font:600 15px/1.2 Georgia,"Times New Roman",serif;margin:0}
#tool .row{gap:10px}
.tick{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--ink);font-weight:500;letter-spacing:0}
.swatch::before{content:"";display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--sw);border:1px solid var(--line);margin-right:6px;vertical-align:-1px}
table{border-collapse:collapse;font-size:13px;width:100%}
td{padding:4px 0;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{color:var(--muted);width:42%;padding-right:8px}
.dpis{display:flex;flex-wrap:wrap;gap:4px 10px}
.dpis>span{white-space:nowrap}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{color:var(--accent);font-weight:600;font-size:13px}
.crop{width:100%;height:320px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--chip)}
.crop img{max-width:none;max-height:none;display:block}
.note{font-size:12px;color:var(--muted)}
#boardsbtn{position:fixed;right:16px;bottom:16px}
#bpop{position:fixed;z-index:1000;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;width:260px;max-width:calc(100vw - 16px);max-height:calc(100vh - 16px);overflow:auto;box-shadow:0 8px 30px rgba(0,0,0,.25);display:grid;gap:8px;font-size:14px}
#bpop label{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);font-weight:400;letter-spacing:0;cursor:pointer;min-height:28px}
.new{display:flex;flex-wrap:wrap;gap:6px}.new input{flex:1;width:0;min-width:120px}
.bpills{display:flex;flex-wrap:wrap;gap:6px}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bitem{border:1px solid var(--line);border-radius:8px;overflow:hidden;font-size:12px;display:grid;align-content:start}
.bitem img{width:100%;aspect-ratio:1/1;object-fit:contain;background:var(--chip)}
.bitem div{padding:6px 8px;display:grid;gap:2px}
.bitem a{color:var(--accent)}
</style>
</head>
<body>
<header>
  <h1>Print Finder</h1>
  <p class="sub">Searches <span id="nsrc"></span> open-access collections and keeps only public domain images big enough to print at the size you choose or larger, showing the largest size each one can print.</p>
</header>
<div class="wrap">
<form id="f">
  <div class="row">
    <label>Theme / keywords<input id="q" type="text" placeholder="one or two words, e.g. iris" value="botanical"></label>
    <label>Medium<select id="medium">
      <option value="">Any</option><option value="painting">Painting</option><option value="drawing">Drawing / watercolour</option>
      <option value="print">Print (engraving, woodcut, litho)</option><option value="photograph">Photograph</option><option value="graphic">Poster / graphic design</option></select></label>
    <label>From year<input id="from" type="number" placeholder="any"></label>
    <label>To year<input id="to" type="number" placeholder="any"></label>
  </div>
  <div class="row">
    <label>Min DPI<select id="dpi"><option value="300">300 (gallery)</option><option value="240">240</option><option value="200" selected>200 (normal viewing)</option><option value="150">150 (bare minimum)</option></select></label>
    <label>Print sizes<select id="sys"><option value="A">A sizes (A4–A0)</option><option value="us">US inches (8×10 – 24×36)</option><option value="frame">Frame sizes cm (18×24 – 70×100)</option><option value="square">Square cm (20×20 – 100×100)</option></select></label>
    <label>Layout<select id="mode"><option value="contain">Whole image, with margins</option><option value="cover">Fill the sheet (crop)</option></select></label>
    <label>Licence<select id="lic"><option value="strict">Public-domain sources only</option><option value="all" selected>Include Wikimedia (check licence)</option></select></label>
    <button class="btn" type="submit" id="go">Search</button>
  </div>
  <details class="srcbox" id="srcbox"><summary id="srcsum">Sources</summary><div class="srcs" id="srcs"></div></details>
  <details class="settings"><summary>Settings</summary><div class="row" style="margin-top:8px"><label>Europeana key — only needed if Europeana starts failing (free from pro.europeana.eu)<input id="eukey" type="text" value="api2demo" style="width:220px"></label><label>Smithsonian key — the shared DEMO_KEY allows ~10 searches an hour (free key: api.data.gov/signup)<input id="sikey" type="text" value="DEMO_KEY" style="width:220px"></label><button class="btn ghost" type="button" id="selftest">Test all sources</button></div></details>
  <div class="need" id="need"></div>
</form>
<div id="status"></div>
<div class="row" id="tools" hidden style="margin:0 0 14px">
  <label>Sort<select id="sort"><option value="best">Best match</option><option value="res">Largest print size</option><option value="mp">Most pixels</option><option value="early">Earliest first</option><option value="late">Latest first</option><option value="title">Title A–Z</option></select></label>
  <div class="chips" id="orients" role="group" aria-label="Shape"><button type="button" class="chip on" aria-pressed="true" data-v="">Any shape</button><button type="button" class="chip" aria-pressed="false" data-v="portrait">Portrait</button><button type="button" class="chip" aria-pressed="false" data-v="landscape">Landscape</button><button type="button" class="chip" aria-pressed="false" data-v="square">Square-ish</button></div>
  <div class="chips"><button type="button" class="chip on" aria-pressed="true" id="artonly" title="Hides ceramics, sculpture, furniture, costume, coins and other 3-D objects">Artworks only</button></div>
  <div class="chips" id="mins" role="group" aria-label="Minimum print size"></div>
</div>
<div class="grid" id="grid"></div>
<div class="empty" id="empty">Press Search to find printable images.</div>
<div class="more" id="more" hidden><span id="moretxt"></span><button class="btn ghost" type="button" id="deeper" hidden>Search deeper</button></div>
</div>
<button class="btn" id="boardsbtn" type="button">Boards</button>
<div id="bpop" role="dialog" aria-label="Save to board" hidden></div>

<dialog id="dlg" aria-labelledby="dtitle"><button class="x" id="dclose" type="button" aria-label="Close">✕</button><div id="dbody"></div></dialog>
<dialog id="panel" aria-labelledby="ptitle"><button class="x" id="pclose" type="button" aria-label="Close">✕</button><div class="dinfo" id="pbody"></div></dialog>

<script>
"use strict";
/* ---------- constants ---------- */
/* paper sizes by system, smallest first, in mm [short, long]; results must reach at least the smallest size of the chosen system */
const IN=25.4;
const SYSTEMS={
  A:{name:"A sizes",unit:"cm",sizes:{A4:[210,297],A3:[297,420],A2:[420,594],A1:[594,841],A0:[841,1189],"2A0":[1189,1682],"4A0":[1682,2378]},chips:["A3","A2","A1","A0"]},
  us:{name:"US inches",unit:"in",sizes:{"8×10":[8*IN,10*IN],"11×14":[11*IN,14*IN],"12×16":[12*IN,16*IN],"16×20":[16*IN,20*IN],"18×24":[18*IN,24*IN],"20×30":[20*IN,30*IN],"24×36":[24*IN,36*IN]},chips:["11×14","16×20","18×24","24×36"]},
  frame:{name:"Frame sizes (cm)",unit:"cm",sizes:{"18×24":[180,240],"24×30":[240,300],"30×40":[300,400],"40×50":[400,500],"50×70":[500,700],"60×80":[600,800],"70×100":[700,1000]},chips:["30×40","50×70","60×80","70×100"]},
  square:{name:"Square (cm)",unit:"cm",sizes:{"20×20":[200,200],"30×30":[300,300],"40×40":[400,400],"50×50":[500,500],"70×70":[700,700],"100×100":[1000,1000]},chips:["30×30","50×50","70×70","100×100"]}
};
const sizeKeys=sys=>Object.keys(SYSTEMS[sys].sizes);
const sizeName=(sys,k)=>sys==="A"?k:`${k} ${SYSTEMS[sys].unit}`; // "A2", "16×20 in", "50×70 cm"
const aSize=(sys,k)=>(/^(A|8|11|18)/.test(k)?"an ":"a ")+sizeName(sys,k); // "an A4", "an 18×24 cm", "a 30×40 cm"
const MED={
  painting:{cma:"Painting",aic:"Painting",met:"Paintings",getty:"300033618",loc:"paintings",mia:"Paintings",wellcome:"Paintings,Oil paintings,Watercolor painting,Gouaches",re:/paint|oil|tempera|maleri|olie/i},
  drawing:{cma:"Drawing",aic:"Drawing and Watercolor",met:"Drawings",getty:"300033973",loc:"drawings",mia:"Drawings",wellcome:"Drawings,Ink drawings,Chalk drawings,Sketches,Watercolor painting,Gouaches",re:/draw|watercol|gouache|tegning|akvarel|chalk|pastel/i},
  print:{cma:"Print",aic:"Print",met:"Prints",getty:"300041273",loc:"",mia:"Prints",wellcome:"Prints,Engraving and Engravings,Etching,Lithography,Wood engravings,Woodcuts,Stipple engraving,Intaglio prints,Aquatint,Chromolithography,Portrait prints",re:/print|engrav|etch|woodcut|woodblock|lithog|mezzotint|aquatint|grafik|kobberstik|træsnit|radering|litografi/i},
  photograph:{cma:"Photograph",aic:"Photograph",met:"Photographs",getty:"300046300",loc:"",mia:"Photographs",wellcome:"Photographs,Photographic prints,Portrait photographs,Albumen prints,Gelatin silver prints",re:/photo|albumen|gelatin|daguerre|cyanotype|fotografi/i},
  // posters, flyers, adverts: only these four have a poster category; every other source searches with the word "poster" added (see srcOpts)
  graphic:{met:"Posters",getty:"300027221",loc:"posters",wellcome:"Posters",re:/poster|affiche|plakat|placard|broadside|advert|flyer|handbill|reklame|show ?card|ephemera|graphic design/i}
};
/* the search as one source sees it: a medium it has no category for becomes a search word instead */
const srcOpts=(k,o)=>o.medium==="graphic"&&!MED.graphic[k]?{...o,q:(o.q+" poster").trim(),medium:""}:o;
/* vetted: every result is checked for a public-domain / CC0 licence; Wikimedia's licence tags are not reliable */
const SOURCES=[
  {key:"rijks",name:"Rijksmuseum",vetted:true},
  {key:"nga",name:"National Gallery of Art (DC)",vetted:true},
  {key:"cma",name:"Cleveland Museum of Art",vetted:true},
  {key:"aic",name:"Art Institute of Chicago",vetted:true},
  {key:"met",name:"The Met (New York)",vetted:true},
  {key:"getty",name:"Getty Museum (Los Angeles)",vetted:true},
  {key:"si",name:"Smithsonian (19 museums)",vetted:true},
  {key:"loc",name:"Library of Congress",vetted:true},
  {key:"mia",name:"Minneapolis Institute of Art",vetted:true},
  {key:"wellcome",name:"Wellcome Collection",vetted:true},
  {key:"ycba",name:"Yale Center for British Art",vetted:true},
  {key:"yuag",name:"Yale University Art Gallery",vetted:true},
  {key:"smk",name:"SMK (Denmark)",vetted:true},
  {key:"eu",name:"Europeana (300+ European museums)",vetted:true},
  {key:"wm",name:"Wikimedia Commons",vetted:false}
];
const SRC=Object.fromEntries(SOURCES.map(s=>[s.key,s]));
const shortName=k=>SRC[k].name.replace(/ \(.*\)$/,""); // for pills and cards: "Smithsonian", not "Smithsonian (19 museums)"
/* Rijksmuseum titles are mostly Dutch: English theme words are also searched as Dutch title words */
const NL={botanical:["plant","planten","bloem","bloemen","tak"],flower:["bloem","bloemen"],flowers:["bloem","bloemen","bloemstilleven"],
  bird:["vogel","vogels"],birds:["vogel","vogels"],butterfly:["vlinder","vlinders"],butterflies:["vlinder","vlinders"],insect:["insect","insecten"],insects:["insect","insecten"],
  map:["kaart","plattegrond"],maps:["kaart","plattegrond"],landscape:["landschap","rivierlandschap"],seascape:["zeegezicht"],sea:["zee","zeegezicht"],ship:["schip","schepen"],ships:["schip","schepen"],
  portrait:["portret"],"still life":["stilleven"],astronomy:["maan","komeet","hemel","sterren"],architecture:["gebouw","kerk","paleis","gevel"],anatomy:["anatomie","skelet","anatomische"],
  "fashion plate":["modeprent","mode"],fashion:["mode","modeprent"],poster:["affiche"],mushroom:["paddenstoel","paddenstoelen"],mushrooms:["paddenstoel","paddenstoelen"],
  shell:["schelp","schelpen"],shells:["schelp","schelpen"],animal:["dier","dieren"],animals:["dier","dieren"],paris:["Parijs"],venice:["Venetië"],garden:["tuin","tuinen"],
  tulip:["tulp","tulpen"],rose:["roos","rozen"],horse:["paard","paarden"],dog:["hond"],cat:["kat"],tree:["boom","bomen"],river:["rivier"],city:["stad","stadsgezicht"],
  winter:["winter","ijs"],fish:["vis","vissen"],fruit:["vruchten","fruit"],woman:["vrouw"],cow:["koe","koeien"],lion:["leeuw"],elephant:["olifant"],monkey:["aap"],
  japanese:["Japan","Japanse"],woodblock:["houtsnede"],"japanese woodblock":["Japan","Japanse"],church:["kerk"],castle:["kasteel"],windmill:["molen"],moon:["maan"]};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const safeUrl=u=>/^https?:\/\//i.test(u||"")?u:"#"; // links come from museum data and imported backups: web addresses only
const strip=s=>new DOMParser().parseFromString(String(s??""),"text/html").body.textContent.trim(); // inert parse: nothing in the HTML can run or load
const yearOf=s=>{const m=String(s??"").match(/(1[0-9]{3}|20[0-2][0-9])/);return m?+m[1]:null;};
const fmtPx=it=>`${(+it.w||0).toLocaleString()}×${(+it.h||0).toLocaleString()}`;
const arr=x=>x==null?[]:Array.isArray(x)?x:[x];
const newId=()=>"b"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

/* ---------- print maths ---------- */
function fit(it,o){
  const L=Math.max(it.w,it.h), S=Math.min(it.w,it.h), sys=SYSTEMS[o.sys];
  const sizes=Object.entries(sys.sizes).map(([k,[ps,pl]])=>{ps/=IN;pl/=IN;
    // "contain": whole image as large as fits on the sheet → dpi set by the tighter side; "cover": fills the sheet, cropping the excess
    const dpi=Math.round(o.mode==="cover"?Math.min(L/pl,S/ps):Math.max(L/pl,S/ps));
    const ar=L/S,par=pl/ps,crop=Math.round((1-Math.min(ar,par)/Math.max(ar,par))*100); // % lost when filling this sheet
    return {k,dpi,crop};});
  const best=sizes.filter(x=>x.dpi>=o.dpi).pop(); // largest size that still meets the dpi
  const u=sys.unit==="in"?1:2.54;
  return {pass:!!best,max:best?.k||null,rank:best?sizes.indexOf(best):-1,eff:(best||sizes[0]).dpi,crop:(best||sizes[0]).crop,sizes,
    printW:it.w/o.dpi*u,printH:it.h/o.dpi*u}; // printed size at the chosen dpi, in the system's unit
}
/* fit() only depends on the item and dpi/layout, but every redraw filters and sorts all results: remember it */
const fitMemo=new WeakMap();
function fitOf(it,o){const k=o.dpi+o.mode+o.sys,m=fitMemo.get(it);if(m&&m.k===k)return m.f;const f=fit(it,o);fitMemo.set(it,{k,f});return f;}
function orientOf(it){const r=it.w/it.h;return r>1.08?"landscape":r<0.92?"portrait":"square";}

/* ---------- network helpers ---------- */
async function getJSON(url,ms=20000){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
  try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw new Error(r.status===429?"too many requests":"HTTP "+r.status);return await r.json();}
  catch(e){throw new Error(e.name==="AbortError"?"timeout":e.message==="Failed to fetch"?"blocked or offline":e.message)}
  finally{clearTimeout(t)}
}
async function pool(list,n,fn){const out=[];let i=0;
  await Promise.all(Array.from({length:Math.min(n,list.length)},async()=>{while(i<list.length){const j=i++;try{out[j]=await fn(list[j])}catch(e){out[j]=null}}}));
  return out;}
const EN="300388277";
const isEn=o=>arr(o.language).some(l=>String(l.id||"").endsWith(EN));
const notation=(n,lang="en")=>{const a=arr(n);return (a.find(x=>x["@language"]===lang)||a[0]||{})["@value"]||"";};
const rijksData=id=>String(id).replace("https://id.rijksmuseum.nl/","https://data.rijksmuseum.nl/")+"?_profile=la-framed";
/* first n bytes of a file: stops downloading even when a server ignores the Range header and sends everything */
async function headBytes(url,n){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),20000);
  try{
    const r=await fetch(url,{headers:{Range:"bytes=0-"+(n-1)},signal:c.signal});if(!r.ok)return null;
    const rd=r.body.getReader(),b=new Uint8Array(n);let got=0;
    while(got<n){const {done,value}=await rd.read();if(done)break;const k=Math.min(value.length,n-got);b.set(value.subarray(0,k),got);got+=k;}
    rd.cancel().catch(()=>{});
    return b.subarray(0,got);
  }catch(e){return null}finally{clearTimeout(t)}
}
/* pixel size from a JPEG's start-of-frame marker */
function sofSize(b){
  let i=2;
  while(i+9<b.length){
    if(b[i]!==0xFF){i++;continue}
    const m=b[i+1];
    if(m===0xFF){i++;continue} // fill byte
    if(m===0xD8||m===0x01||(m>=0xD0&&m<=0xD7)){i+=2;continue}
    if(m>=0xC0&&m<=0xCF&&m!==0xC4&&m!==0xC8&&m!==0xCC)return {h:b[i+5]<<8|b[i+6],w:b[i+7]<<8|b[i+8]};
    i+=2+(b[i+2]<<8|b[i+3]);
  }
  return null;
}
/* pixel size of a JPEG from its first bytes (needs CORS on the image host); reads further if the header is long */
async function jpegSize(url){
  for(const n of [65536,262144]){
    const b=await headBytes(url,n);if(!b)return null;
    const sz=sofSize(b);if(sz)return sz;
    if(b.length<n)return null; // whole file read, no size found
  }
  return null;
}
/* rights statements, kept with saved items as evidence: museums that release everything as CC0 get the CC0 deed */
const CC0="https://creativecommons.org/publicdomain/zero/1.0/";
const ccUrl=s=>String(s||"").split(/\s+/).find(x=>/^https?:\/\/(www\.)?(creativecommons\.org|rightsstatements\.org)\//.test(x))||""; // first licence link in a list of ids
const AIC_MIN=Math.min(...Object.keys(SYSTEMS).map(k=>need(150,k).needS)); // smallest short side of any system at the lowest dpi on offer
const NGA_PAGE=200;
const NGA_ONE=4096; // NGA's image server sends at most this many px a side per picture (not stated in its info.json; bigger w,h requests come back squashed)
/* search text for Lucene-style engines (Mia, Smithsonian): plain words only, so it can't cancel the public-domain clause ("forget me NOT") */
const plainWords=q=>q.replace(/[+\-=&|<>!(){}[\]^"~*?:\\/]/g," ").replace(/\b(AND|OR|NOT)\b/g,m=>m.toLowerCase()).trim();
/* National Gallery index: one array per field (smaller and faster to read than rows); artist and medium are numbers into shared lists */
let ngaIndex=null;
function loadNGA(){
  return ngaIndex||(ngaIndex=fetch("nga-index-v2.json").then(r=>{if(!r.ok)throw new Error("nga-index-v2.json missing");return r.json()}).then(X=>{
    // one lower-case search text per picture, built once: title, artist, medium and the museum's descriptive keywords
    X.hay=X.title.map((t,i)=>(t+" "+X.artists[X.artist[i]]+" "+X.media[X.medium[i]]+" "+X.kw[i]).toLowerCase());
    return X;
  }).catch(e=>{ngaIndex=null;throw e}));
}

/* Yale museums share LUX search + IIIF manifests; collection names are LUX set names, picked by medium */
const YALE={
  ycba:{suffix:", Yale Center for British Art",sets:{painting:["Paintings and Sculpture Collection"],drawing:["Prints and Drawings Collection"],print:["Prints and Drawings Collection"],photograph:["Prints and Drawings Collection"],
    "":["Paintings and Sculpture Collection","Prints and Drawings Collection"]}},
  yuag:{suffix:", Yale University Art Gallery",sets:{painting:["European Art Collection","American Paintings and Sculpture Collection","Asian Art Collection","Modern and Contemporary Art Collection"],
    drawing:["Prints and Drawings Collection","Asian Art Collection"],print:["Prints and Drawings Collection","Asian Art Collection"],photograph:["Photography Collection"],
    "":["European Art Collection","American Paintings and Sculpture Collection","Prints and Drawings Collection","Photography Collection","Asian Art Collection","Modern and Contemporary Art Collection",
      "African Art Collection","Indo-Pacific Art Collection","Art of the Ancient Americas Collection","Indigenous Arts of the Americas Collection"]}}
};
async function yale(key,o,page){
  const cfg=YALE[key];
  const q={AND:[{hasDigitalImage:1},{OR:cfg.sets[o.medium||""].map(n=>({memberOf:{name:n+cfg.suffix}}))}]};
  if(o.q)q.AND.unshift({text:o.q});
  const d=await getJSON("https://lux.collections.yale.edu/api/search/item?"+new URLSearchParams({q:JSON.stringify(q),page:String(page+1),pageLength:"24"}));
  const ids=arr(d.orderedItems).map(x=>x.id).filter(Boolean);
  const re=new RegExp("/"+key+"/obj/(\\d+)");
  const items=(await pool(ids,6,async id=>{
    const ob=await getJSON(id);
    const thumbs=arr(ob.representation).flatMap(r=>arr(r.digitally_shown_by)).flatMap(x=>arr(x.access_point)).map(a=>a.id||"");
    const objNo=(thumbs.map(t=>t.match(re)).find(Boolean)||[])[1];if(!objNo)return null;
    const man=await getJSON(`https://manifests.collections.yale.edu/${key}/obj/${objNo}`);
    if(!/publicdomain/.test(man.rights||""))return null;
    const cv=arr(man.items)[0];if(!cv)return null;
    const body=arr(cv.items)[0]?.items?.[0]?.body||{};
    const iiif=arr(body.service).map(x=>x["@id"]||x.id).find(Boolean);if(!iiif)return null;
    const meta=(...ks)=>{for(const k of ks){const v=(arr(man.metadata).find(m=>arr(m.label?.en)[0]===k)?.value?.en||[])[0];if(v)return v}return ""};
    const pr=ob.produced_by||{},ts=pr.timespan||{};
    // medium = classification + materials, never YCBA's department name ("Paintings and Sculpture" would read as sculpture)
    return {id:key+"-"+objNo,src:key,title:meta("Title")||ob._label||"Untitled",
      artist:[...new Set(arr(pr.part).flatMap(x=>arr(x.carried_out_by)).map(a=>a._label).filter(Boolean))].join(", ").replace(/^Artist[^:]*:\s*/,"")||meta("Creator","Creator(s)").split(",")[0],
      year:yearOf(ts.begin_of_the_begin),date:(arr(ts.identified_by)[0]||{}).content||meta("Date"),medium:[meta("Classification"),meta("Medium")].filter(Boolean).join(" · "),
      w:+(body.width||cv.width),h:+(body.height||cv.height),thumb:iiif+"/full/!400,400/0/default.jpg",preview:iiif+"/full/!1200,1200/0/default.jpg",iiif,
      page:arr(man.homepage)[0]?.id||id,download:iiif+"/full/full/0/default.jpg",licence:/zero/.test(man.rights)?"CC0":"Public domain",rights:ccUrl(man.rights),clientMedium:!!o.medium,clientEra:true};
  })).filter(Boolean);
  return {items,more:!!d.next};
}

/* ---------- source adapters: each returns {items, more}; `st` holds that source's paging state for the current search ---------- */
const adapters={

    if(o.q)p.set("q",o.q);

    const items=(d.data||[]).filter(a=>a.images&&(a.images.full||a.images.print)).map(a=>{
      const full=a.images.full||a.images.print;
      return {id:"cma-"+a.id,src:"cma",title:a.title||"Untitled",artist:(a.creators&&a.creators[0]&&a.creators[0].description)||a.culture?.[0]||"",
        year:a.creation_date_earliest??yearOf(a.creation_date),date:a.creation_date||"",medium:[a.type,a.technique].filter(Boolean).join(" · "),

        page:a.url,download:full.url,downloadAlt:a.images.print?.url,licence:a.share_license_status||"CC0",rights:CC0};
    });

  },
  /* Art Institute of Chicago: sizes are the master file's; the size pre-filter uses the lowest dpi on offer, so a later dpi change can't miss anything */
  async aic(o,page,noSize){
    const filter=[{term:{is_public_domain:true}},{exists:{field:"image_id"}}];
    if(o.medium)filter.push({match:{artwork_type_title:MED[o.medium].aic}});
    if(o.from!=null)filter.push({range:{date_end:{gte:o.from}}});

    if(!noSize)filter.push({bool:{should:[{range:{"thumbnail.width":{gte:AIC_MIN}}},{range:{"thumbnail.height":{gte:AIC_MIN}}}],minimum_should_match:1}});
    const params={limit:100,page:page+1,fields:["id","title","image_id","thumbnail","date_start","date_end","date_display","medium_display","artwork_type_title","artist_title"],query:{bool:{filter}}};
    if(o.q)params.q=o.q;

    try{d=await getJSON("https://api.artic.edu/api/v1/artworks/search?params="+encodeURIComponent(JSON.stringify(params)));}
    catch(e){if(!noSize)return adapters.aic(o,page,true);throw e;}
    const iiif=d.config?.iiif_url||"https://www.artic.edu/iiif/2";
    const items=(d.data||[]).filter(a=>a.image_id&&a.thumbnail?.width).map(a=>({

      thumb:`${iiif}/${a.image_id}/full/400,/0/default.jpg`,thumbAlt:[`${iiif}/${a.image_id}/full/843,/0/default.jpg`,{src:`${iiif}/${a.image_id}/full/600,/0/default.jpg`,ref:true}],
      preview:`${iiif}/${a.image_id}/full/843,/0/default.jpg`,previewAlt:[{src:`${iiif}/${a.image_id}/full/600,/0/default.jpg`,ref:true}],lqip:/^data:image\/gif;base64,[\w+/=]+$/.test(a.thumbnail.lqip||"")?a.thumbnail.lqip:"",
      iiif:`${iiif}/${a.image_id}`,page:`https://www.artic.edu/artworks/${a.id}`,download:`${iiif}/${a.image_id}/full/full/0/default.jpg`,

  },
  async smk(o,page){

  /* Rijksmuseum: search returns IDs only; each is resolved object → visual item → digital object → IIIF info.json */
  async rijks(o,page,_,st){

      const base={imageAvailable:"true"};
      if(o.medium)base.type=o.medium;
      if(o.from!=null&&o.to!=null&&Math.floor(o.from/100)===Math.floor(o.to/100))base.creationDate=Math.floor(o.from/100)+"??";
      const q=o.q.toLowerCase().trim();const terms=new Set();
      if(q){ (NL[q]||[]).forEach(t=>terms.add(t)); q.split(/\s+/).forEach(w=>(NL[w]||[]).forEach(t=>terms.add(t))); terms.add(o.q); }
      st.streams=q?[...[...terms].map(t=>({...base,title:t})),{...base,description:o.q}]:[base];
      st.streams=st.streams.map(p=>({url:"https://data.rijksmuseum.nl/search/collection?"+new URLSearchParams(p)}));
      st.buf=[];st.ids=new Set();st.okOnce=false;
    }
    // fill the buffer of object IDs
    while(st.buf.length<12&&st.streams.some(s=>s.url)){
      const s=st.streams.find(s=>s.url);
      try{const d=await getJSON(s.url);st.okOnce=true;
        arr(d.orderedItems).forEach(x=>{if(x.id&&!st.ids.has(x.id)){st.ids.add(x.id);st.buf.push(x.id)}});
        s.url=d.next?.id||(typeof d.next==="string"?d.next:null);
      }catch(e){if(!st.okOnce)throw e;s.url=null;}
    }
    const batch=st.buf.splice(0,12);
    const items=(await pool(batch,6,async id=>{
      const ob=await getJSON(rijksData(id));
      const vi=arr(ob.shows)[0];if(!vi)return null;
      const v=await getJSON(rijksData(vi.id));
      const rights=arr(v.subject_to).flatMap(r=>arr(r.classified_as)).map(c=>c.id||"").join(" ");
      if(!/publicdomain/.test(rights))return null; // no rights statement: not assumed free
      const dobj=arr(v.digitally_shown_by)[0];if(!dobj)return null;
      const dg=await getJSON(rijksData(dobj.id));
      const ap=arr(dg.access_point).map(a=>a.id).find(x=>/iiif\.micr\.io\//.test(x||""));if(!ap)return null;
      const mid=ap.match(/iiif\.micr\.io\/([^/]+)/)[1],iiif="https://iiif.micr.io/"+mid;
      const info=await getJSON(iiif+"/info.json");
      const names=arr(ob.identified_by).filter(x=>x.type==="Name");
      const title=(names.find(isEn)||names[0]||{}).content||"Untitled";
      const objNo=(arr(ob.identified_by).find(x=>x.type==="Identifier")||{}).content||"";
      const pr=ob.produced_by||{};
      const cre=(arr(pr.referred_to_by).find(isEn)||arr(pr.referred_to_by)[0]||{}).content||
        arr(pr.part).flatMap(p=>arr(p.carried_out_by)).map(a=>notation(a.notation)).filter(Boolean).join(", ");
      const ts=pr.timespan||{};
      const dateTxt=(arr(ts.identified_by).find(isEn)||arr(ts.identified_by)[0]||{}).content||"";
      const med=[...arr(ob.classified_as).map(c=>notation(c.notation)),...arr(pr.technique).map(c=>notation(c.notation))].filter(Boolean);
      const pageUrl=arr(ob.subject_of).flatMap(s=>arr(s.digitally_carried_by)).flatMap(d=>arr(d.access_point)).map(a=>a.id).find(Boolean)

  /* Getty: SPARQL finds objects with images; each image record gives its CC0 status, pixel size and IIIF service */
  async getty(o,page){

        medium:[w.workType?.label,...arr(s.genres).map(g=>g.label),w.physicalDescription].filter(Boolean).join(" · "),w:+inf.width,h:+inf.height,
        thumb:th+"/full/!400,400/0/default.jpg",preview:th+"/full/!1024,1024/0/default.jpg",iiif,page:"https://wellcomecollection.org/works/"+s.id,

  /* Library of Congress: search results carry the rights statement; pixel size comes from the IIIF info.json of the master file (1 request per item) */
  async loc(o,page){
    const maps=!o.medium&&/\bmaps?\b/i.test(o.q);
    const fa=["online-format:image","access-restricted:false"];
    if(o.medium&&MED[o.medium].loc)fa.push("subject:"+MED[o.medium].loc);
    const p=new URLSearchParams({fo:"json",c:"25",sp:String(page+1),fa:fa.join("|")});
    if(o.q)p.set("q",o.q);
    if(o.from!=null||o.to!=null)p.set("dates",(o.from??0)+"/"+(o.to??2100));
    const d=await getJSON(`https://www.loc.gov/${maps?"maps":"photos"}/?`+p,30000);
    const T="https://tile.loc.gov/image-services/iiif/";
    const kind=g=>/photomechan|lithog|engrav|etching|woodcut|poster|chromo|mezzotint|aquatint|serigraph|screen ?print|halftone/i.test(g)?"Print":
      /photo|negative|daguerre|ambrotype|tintype|stereograph|albumen|gelatin|cyanotype|transparenc|slide/i.test(g)?"Photograph":
      /drawing|watercol|sketch|gouache|pastel|charcoal|pencil|chalk/i.test(g)?"Drawing":/painting/i.test(g)?"Painting":
      /\bmaps?\b|atlas/i.test(g)?"Map":/print|label|cartoon|broadside/i.test(g)?"Print":"";
    const items=(await pool(d.results||[],6,async r=>{
      const it=typeof r.item==="object"&&r.item||{};
      if(r.access_restricted||!r.url)return null;
      const imgs=arr(r.image_url).map(u=>u.split("#")[0]);
      const gmd=imgs.some(u=>/[/:]gmd[/:]/.test(u));
      // rights: keep only "No known restrictions on publication/use…" or "public domain"; Geography & Map items with no advisory are free to use per LoC policy
      const rt=[...arr(it.rights_advisory),...arr(it.rights_information),...arr(it.rights)].map(strip).join(" ").trim();
      const ok=rt?/^(no known restrictions on (publication|use|reproduction)|public domain)/i.test(rt)&&!/may be restricted|restricted by copyright|not evaluated|permission/i.test(rt):gmd;
      if(!ok)return null;
      let iiif=(imgs.find(u=>u.startsWith(T))||"").split("/full/")[0]||null,info=null,svc=imgs.filter(u=>/storage-services\/service\/pnp\/.+\.jpg$/.test(u)&&!/_150px/.test(u));
      if(!iiif){const m=(svc[0]||"").match(/storage-services\/service\/(pnp\/.+\/[a-z0-9]+?)(?:[a-z]|_\d+px)?\.jpg$/);if(m)iiif=T+"master:"+m[1].replace(/\//g,":")+"u";}
      if(iiif)info=await getJSON(iiif+"/info.json",15000).catch(()=>null);
      if(!info){ // master name not guessable: read the item's file list
        const j=await getJSON(r.url.replace(/^http:/,"https:")+"?fo=json");
        const f=arr(j.resources?.[0]?.files?.[0]);const tif=f.find(x=>/\.(tif|jp2)$/.test(x.url||""));
        iiif=tif&&(tif.info?tif.info.replace(/\/info\.json$/,""):T+tif.url.split("storage-services/")[1].replace(/\.\w+$/,"").replace(/\//g,":"));
        if(!iiif)return null;info=await getJSON(iiif+"/info.json",15000);
      }
      const w=+info.width,h=+info.height;if(!(w>0&&h>0))return null;
      const g=[...arr(it.genre),...arr(it.formats).map(x=>x.title||x),...arr(r.original_format)].filter(Boolean).join(" · ");
      const k=gmd?"Map":kind([...arr(it.genre),...arr(it.formats).map(x=>x.title||x)].join(" "));
      if(o.medium&&o.medium!=="graphic"&&k.toLowerCase()!==o.medium)return null; // posters are already picked by subject
      const big=svc.length?svc[svc.length-1]:null,small=svc.find(u=>/r\.jpg$/.test(u))||big;
      const id=String(r.id||r.url).replace(/\/$/,"").split("/").pop();
      return {id:"loc-"+id,src:"loc",title:r.title||it.title||"Untitled",
        artist:(it.creators?.[0]?.title||arr(it.contributors)[0]||arr(r.contributor)[0]||"").replace(/[,.]?\s*(photographer|artist|publisher|printer|lithographer|engraver|cartographer|creator|draftsman|designer|illustrator|author)[.,]?\s*$/i,""),
        year:yearOf(arr(r.dates)[0]||r.date),date:it.date||it.created_published_date||arr(r.dates)[0]||"",medium:[k,g].filter(Boolean).join(" · "),w,h,
        thumb:small||iiif+"/full/400,/0/default.jpg",preview:big||iiif+"/full/!1200,1200/0/default.jpg",iiif,
        page:r.url.replace(/^http:/,"https:"),download:iiif+"/full/full/0/default.jpg",licence:rt?rt.split(/(?<=\.)\s/)[0]:"No known restrictions (LoC Geography & Map policy)",clientEra:true};
    })).filter(Boolean);
    return {items,more:!!d.pagination?.next};
  },

  /* National Gallery of Art: searched locally in the open-data index (nga-index-v2.json), handed out in pages like the other sources */
  async nga(o,page,_,st){
    const X=await loadNGA();
    if(!st.list){
      // whole words, plurals allowed: "iris" finds "irises" but not "Irish", "flower" finds "flowers"
      const words=o.q.toLowerCase().split(/\s+/).filter(Boolean).map(w=>new RegExp("(^|[^\\p{L}\\p{N}])"+w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(e?s)?($|[^\\p{L}\\p{N}])","u"));
      const cls={painting:"p",drawing:"d",print:"r",photograph:"f"}[o.medium];
      st.list=[];
      for(let i=0;i<X.n;i++){
        if(cls&&X.cls[i]!==cls)continue;
        if(o.from!=null&&(X.y1[i]??X.y0[i]??-1e9)<o.from)continue;
        if(o.to!=null&&(X.y0[i]??1e9)>o.to)continue;
        if(words.every(w=>w.test(X.hay[i])))st.list.push(i);
      }
    }
    const items=st.list.slice(page*NGA_PAGE,(page+1)*NGA_PAGE).map(i=>{
      const iiif="https://api.nga.gov/iiif/"+X.id[i].replace(/^(.{8})(.{4})(.{4})(.{4})/,"$1-$2-$3-$4-"); // ids are stored without dashes
      return {id:"nga-"+X.oid[i],src:"nga",title:X.title[i],artist:X.artists[X.artist[i]],year:X.y0[i],date:X.date[i],medium:X.media[X.medium[i]],w:X.w[i],h:X.h[i],
        thumb:iiif+"/full/!400,400/0/default.jpg",preview:iiif+"/full/!1200,1200/0/default.jpg",iiif,
        page:"https://www.nga.gov/collection/art-object-page."+X.oid[i]+".html",download:iiif+"/full/max/0/default.jpg",licence:"CC0",rights:CC0,
        sizeNote:Math.max(X.w[i],X.h[i])>NGA_ONE?`The museum's server sends at most ${NGA_ONE.toLocaleString()} px per side in one file, so “Full-size file” is smaller than this. “Make print file…” joins pieces to use every pixel.`:""};
    });
    return {items,more:(page+1)*NGA_PAGE<st.list.length};
  },

  /* Europeana: aggregator. Search pre-filters to >4 MP public-domain images; exact pixel size comes from each record */
  async eu(o,page,_,st){
    const key=$("eukey").value.trim()||"api2demo";
    const p=new URLSearchParams({wskey:key,query:(o.q||"*")+(o.medium?" "+o.medium:""),rows:"24",cursor:st.cursor||"*",media:"true",profile:"rich"});
    // "reusability=open" also admits CC BY / BY-SA, which can fill whole pages; ask for PD/CC0 only
    p.append("qf","TYPE:IMAGE");p.append("qf","IMAGE_SIZE:extra_large");p.append("qf","RIGHTS:*publicdomain*");
    if(o.from!=null||o.to!=null)p.append("qf",`YEAR:[${o.from??0} TO ${o.to??2100}]`);
    const d=await getJSON("https://api.europeana.eu/record/v2/search.json?"+p);
    st.cursor=d.nextCursor;
    const cand=(d.items||[]).filter(it=>arr(it.rights).some(r=>/publicdomain/.test(r)));
    const items=(await pool(cand,5,async it=>{
      const r=await getJSON(`https://api.europeana.eu/record/v2${it.id}.json?wskey=${encodeURIComponent(key)}`);
      const ag=arr(r.object?.aggregations)[0]||{};
      const shown=ag.edmIsShownBy;
      const wr=arr(ag.webResources).filter(w=>w.ebucoreWidth&&w.ebucoreHeight);
      const best=wr.find(w=>w.about===shown)||wr.sort((a,b)=>b.ebucoreWidth*b.ebucoreHeight-a.ebucoreWidth*a.ebucoreHeight)[0];
      if(!best)return null;
      const prov=arr(it.dataProvider)[0]||"";
      const lic=arr(it.rights)[0]||"";
      return {id:"eu-"+it.id,src:"eu",title:arr(it.title)[0]||"Untitled",artist:arr(it.dcCreator)[0]||"",year:yearOf(arr(it.year)[0]),date:arr(it.year)[0]||"",
        medium:prov?"via "+prov:"",w:+best.ebucoreWidth,h:+best.ebucoreHeight,thumb:arr(it.edmPreview)[0],preview:arr(it.edmPreview)[0],
        page:ag.edmIsShownAt||it.guid,download:best.about,licence:/zero/.test(lic)?"CC0":"Public domain mark",rights:ccUrl(lic),clientEra:true,provider:prov};
    })).filter(Boolean);
    return {items,more:!!d.nextCursor&&(d.items||[]).length>0};
  }
};

/* ---------- search engine ---------- */
const PAGE=48; // cards added each time the viewer scrolls near the bottom
const NEAR=1200; // px: load the next batch when the bottom of the grid is this close to the screen
let results=[],seen=new Set(),state={},runId=0;
let searched=null; // the submitted search: results are filtered and fetched with this, not with anything typed since
let view={src:new Set(),orient:"",min:"",art:true,sort:"best",limit:PAGE,order:[]};
let lastList=[],lastFetchAt=-1; // last rendered result list; its length when sources were last asked for more
/* the submitted search, with the live dpi, layout, size system and licence (changing those re-grades results instantly) */
function cur(){const o=opts();return searched?{...searched,dpi:o.dpi,mode:o.mode,sys:o.sys,lic:o.lic}:o;}
function keep(it,o){
  if(!(it.w>0&&it.h>0))return false;
  if(o.lic!=="all"&&!SRC[it.src].vetted)return false;
  if(!fitOf(it,o).pass)return false;
  if(it.clientMedium&&o.medium&&!MED[o.medium].re.test(it.medium))return false;
  if(o.medium==="graphic"&&!MED.graphic[it.src]&&(!MED.graphic.re.test(it.title+" "+it.medium)||/poster ?(paint|colou?r)|photo|gelatin/i.test(it.medium)))return false; // searched by the word "poster": keep only what says so (not poster paint or photos of posters)
  if(it.clientEra&&(o.from!=null||o.to!=null)){
    if(it.year==null)return it.src==="wm";
    if(o.from!=null&&it.year<o.from)return false;
    if(o.to!=null&&it.year>o.to)return false;
  }
  return true;

/* "Artworks only": drops 3-D and functional objects, judged only on each museum's own object type / medium text (titles are unreliable: "Vase of Flowers" is usually a picture) */

/* each source pages independently, so fast sources show results straight away */

function iiifInfo(base){ // a picture's info.json, fetched once

  return infoCache.get(base);

const iiifV3=d=>d.type==="ImageService3"||/image\/3\//.test(String(d["@context"]));
/* the most one request can ask for: the server's stated limits, or a cap we know it applies without saying so; IIIF: a maxWidth on its own also caps the height */
function iiifLimits(d){
  const p=Array.isArray(d.profile)&&d.profile[1]||{};let host="";
  try{host=new URL(d["@id"]||d.id).host}catch(e){}
  const mw=d.maxWidth||p.maxWidth||(host==="api.nga.gov"?NGA_ONE:0);
  return {mw,mh:d.maxHeight||p.maxHeight||mw,ma:d.maxArea||p.maxArea};
}
/* the largest w×h (same shape) the server will send in one picture */
function iiifCap(d,w,h){
  const {mw,mh,ma}=iiifLimits(d);
  if(mw&&w>mw){h=h*mw/w;w=mw}
  if(mh&&h>mh){w=w*mh/h;h=mh}
  if(ma&&w*h>ma){const k=Math.sqrt(ma/(w*h));w*=k;h*=k}
  return {w:Math.floor(w),h:Math.floor(h)};
}

  .replace(/[^\w-]+/g,"-").replace(/-{2,}/g,"-").slice(0,60).replace(/^-+|-+$/g,"")||"print"; // plain letters for file names: "Pétrus" → "Petrus"

/* the file with its print dpi in the header (JFIF), so design software opens it at the intended size. An Exif block goes:

    const tag=String.fromCharCode(...b.subarray(i+4,i+9));

/* a file as a Blob, reporting progress as it arrives */

/* how many pixels one canvas may hold (big print files are built on one): about 16.7 MP on iPhones and iPads (and kept to that on Android,

/* a print file built on a canvas: the crop fetched in pieces at its final size and joined, with white margins if asked, then saved as a high-quality JPEG.

      <div class="art" style="left:${(W-ow)/2/W*100}%;width:${ow/W*100}%;bottom:${(FLOOR+SOFA_H+GAP)/H*100}%;height:${oh/H*100}%;background:${FRAMES[st.frame][1]||"transparent"}">
        <div class="mount" style="left:${fw/ow*100}%;right:${fw/ow*100}%;top:${fw/oh*100}%;bottom:${fw/oh*100}%"><div class="pic"></div></div></div></div>`;
    const pic=wall.querySelector(".pic"),iw=cmW+2*mount,ih=cmH+2*mount;
    Object.assign(pic.style,{left:mount/iw*100+"%",right:mount/iw*100+"%",top:mount/ih*100+"%",bottom:mount/ih*100+"%",
      backgroundImage:`url("${String(it.preview||it.thumb||"").replace(/["\\\n]/g,encodeURIComponent)}")`,backgroundSize:o.mode==="cover"?"cover":"contain"});
    const u=SYSTEMS[o.sys].unit,cv=x=>u==="in"?x/2.54:x;
    $("mwdims").textContent=`Print ${cv(cmW).toFixed(0)} × ${cv(cmH).toFixed(0)} ${u}${mount||fw?`, about ${cv(ow).toFixed(0)} × ${cv(oh).toFixed(0)} ${u} framed`:""}. The sofa is ${u==="in"?"83 in":"210 cm"} wide, for scale.`;
  };
  $("mwsize").onchange=e=>{st.k=e.target.value;draw();};
  $("mwframe").onchange=e=>{st.frame=e.target.value;draw();};
  $("mwmount").onchange=e=>{st.mount=e.target.checked;draw();};
  $("mwwall").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;st.wall=b.dataset.v;$("mwwall").querySelectorAll("button").forEach(x=>press(x,x===b));draw();});
  $("mwdone").onclick=closeTools;
  toolStop=()=>{wall.remove();view.classList.remove("walling");view.style.background=bg;};
  draw();toolOpened(); // draw first, so the scroll lands on the finished panel
}

/* ---------- boards ---------- */
/* what a board keeps of an item; also cleans items read from imported backups */
const snap=x=>({id:String(x.id),src:String(x.src||""),title:String(x.title||"Untitled"),artist:String(x.artist||""),date:String(x.date||""),w:+x.w||0,h:+x.h||0,
  thumb:String(x.thumb||""),page:String(x.page||""),download:String(x.download||""),licence:String(x.licence||""),rights:String(x.rights||""),
  saved:/^\d{4}-\d{2}-\d{2}$/.test(String(x.saved))?String(x.saved):""}); // saved = the day the licence was checked
const today=()=>{const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;}; // the viewer's own date, not UTC
function updateBoardsBtn(){$("boardsbtn").textContent=`Boards (${boards.length})${savedIds.size?" · "+savedIds.size+" saved":""}`;}
function refreshStars(id){const c=cardCache.get(id);if(c)syncStar(c,id);updateBoardsBtn();}
function newBoard(name){const b={id:newId(),name:name.trim().slice(0,60)||"Untitled board",items:[]};boards.push(b);saveBoards();return b;}
let popFor=null; // the button the board picker belongs to
function closePop(refocus=true){const pop=$("bpop");if(pop.hidden)return;pop.hidden=true;if(refocus&&popFor?.isConnected)popFor.focus();popFor=null;}
function placePop(){
  const pop=$("bpop"),r=popFor.getBoundingClientRect();
  if(r.bottom<0||r.top>innerHeight){closePop(false);return;} // its button has scrolled away
  const pw=pop.offsetWidth,ph=pop.offsetHeight;
  pop.style.left=Math.max(8,Math.min(innerWidth-pw-8,r.right-pw))+"px";
  pop.style.top=(r.bottom+6+ph>innerHeight?Math.max(8,r.top-ph-6):r.bottom+6)+"px";
}
/* small menu next to the clicked button: tick boards to add/remove the item, or name a new one */
function boardPicker(it,anchor){
  const pop=$("bpop");
  if(!pop.hidden&&popFor===anchor){closePop();return;} // a second click on the same button closes it
  popFor=anchor;
  const draw=focus=>{
    pop.innerHTML=`<b>Save to board</b>${boards.map(b=>`<label><input type="checkbox" data-b="${b.id}" ${b.items.some(x=>x.id===it.id)?"checked":""}> ${esc(b.name)} <span class="note">(${b.items.length})</span></label>`).join("")||'<span class="note">No boards yet — name one:</span>'}
      <div class="new"><input type="text" aria-label="New board name" placeholder="New board name" maxlength="60"><button class="btn" type="button">Add</button></div>`;
    pop.querySelectorAll("[data-b]").forEach(cb=>cb.onchange=()=>{
      const b=boards.find(x=>x.id===cb.dataset.b);
      if(cb.checked){if(!b.items.some(x=>x.id===it.id))b.items.push(snap({...it,saved:today()}));}else b.items=b.items.filter(x=>x.id!==it.id);
      saveBoards();refreshStars(it.id);draw(b.id);});
    const inp=pop.querySelector(".new input"),add=()=>{if(!inp.value.trim())return inp.focus();const b=newBoard(inp.value);b.items.push(snap({...it,saved:today()}));saveBoards();refreshStars(it.id);draw(b.id);};
    pop.querySelector(".new button").onclick=add;inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();add();}};
    (pop.querySelector(`[data-b="${focus}"]`)||pop.querySelector("input"))?.focus({preventScroll:true});
    placePop();
  };
  // inside an open dialog the picker has to live in that dialog, or the modal layer covers it
  const host=anchor.closest("dialog")||document.body;if(pop.parentNode!==host)host.appendChild(pop);
  pop.hidden=false;draw();
}
// composedPath still includes the picker when the clicked element was replaced by a redraw
document.addEventListener("click",e=>{const p=e.composedPath();if(!$("bpop").hidden&&!p.includes($("bpop"))&&!p.includes(popFor))closePop(false);});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("bpop").hidden){e.preventDefault();closePop();}});
document.addEventListener("scroll",e=>{if(!$("bpop").hidden&&!$("bpop").contains(e.target))placePop();},true);
addEventListener("resize",()=>{if(!$("bpop").hidden)placePop();});
/* boards changed in another tab of this site: take them over, so neither tab overwrites the other */
addEventListener("storage",e=>{
  if(e.key!=="pf_boards")return;
  boards=loadBoards();countSaved();cardCache.forEach((c,id)=>syncStar(c,id));updateBoardsBtn();
  if($("panel").open&&$("ptitle")?.textContent==="Boards")showBoards();
});
updateBoardsBtn();
let curBoard=null;
function download(name,data,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),60000);}
const csvCell=v=>{let s=String(v??"");if(/^[=+\-@]/.test(s))s="'"+s;return `"${s.replace(/"/g,'""')}"`;}; // a leading ' stops spreadsheets running it as a formula
function showBoards(msg=""){
  if(!boards.some(b=>b.id===curBoard))curBoard=boards[0]?.id||null;
  const b=boards.find(x=>x.id===curBoard),o=cur();
  $("pbody").innerHTML=`<h2 id="ptitle">Boards</h2>
  <p class="note">Saved in this browser only. Use Backup now and then, and Import to move boards to another device.</p>
  <div class="bpills">${boards.map(x=>`<button type="button" class="chip ${x.id===curBoard?"on":""}" aria-pressed="${x.id===curBoard}" data-pick="${x.id}">${esc(x.name)} (${x.items.length})</button>`).join("")}
    <button type="button" class="chip" id="bnew">＋ New board</button></div>
  <form class="new" id="bnewrow" hidden><input type="text" aria-label="New board name" placeholder="New board name" maxlength="60"><button class="btn">Create</button><button class="btn ghost" type="button" data-cancel>Cancel</button></form>
  ${b?`<div class="links"><button class="btn ghost" type="button" id="bren">Rename</button><button class="btn ghost" type="button" id="bdel">Delete board</button>${b.items.length?'<button class="btn ghost" type="button" id="csv">Download CSV</button><button class="btn ghost" type="button" id="lrec">Licence record</button>':""}</div>
  <form class="new" id="brenrow" hidden><input type="text" aria-label="Board name" maxlength="60" value="${esc(b.name)}"><button class="btn">Save</button><button class="btn ghost" type="button" data-cancel>Cancel</button></form>
  ${b.items.length?`<div class="bgrid">${b.items.map((x,i)=>{const f=fitOf(x,o);return `<div class="bitem"><img src="${esc(x.thumb)}" alt="" referrerpolicy="no-referrer" loading="lazy"><div><b>${esc(x.title)}</b><span class="note">${esc(x.artist)}</span><span>${f.pass?"Max "+sizeName(o.sys,f.max):"Below "+sizeName(o.sys,sizeKeys(o.sys)[0])} · ${fmtPx(x)}</span><span><a href="${esc(safeUrl(x.page))}" target="_blank" rel="noopener">page</a> · <a href="${esc(safeUrl(x.download))}" target="_blank" rel="noopener">file</a> · <button type="button" class="linkbtn" data-rm="${i}">remove</button></span></div></div>`}).join("")}</div>`
    :'<p class="note">Empty. Use ☆ Save on any result to add it here.</p>'}`
  :'<p class="note">No boards yet. Create one here, or use ☆ Save on any result.</p>'}
  <div class="links"><button class="btn ghost" type="button" id="bexp">Backup all boards</button><button class="btn ghost" type="button" id="bimp">Import backup</button><input type="file" id="bfile" accept=".json,application/json" hidden></div>
  ${msg?`<p class="note" role="status">${esc(msg)}</p>`:""}`;
  const P=$("pbody"),reveal=id=>{const r=$(id),i=r.querySelector("input");r.hidden=false;i.focus();i.select();};
  P.querySelectorAll("[data-pick]").forEach(x=>x.onclick=()=>{curBoard=x.dataset.pick;showBoards();});
  P.querySelectorAll("[data-cancel]").forEach(x=>x.onclick=()=>{x.closest("form").hidden=true;});
  $("bnew").onclick=()=>reveal("bnewrow");
  $("bnewrow").onsubmit=e=>{e.preventDefault();const v=e.target.querySelector("input").value;if(!v.trim())return;curBoard=newBoard(v).id;updateBoardsBtn();showBoards();};
  if(b){
    $("bren").onclick=()=>reveal("brenrow");
    $("brenrow").onsubmit=e=>{e.preventDefault();const v=e.target.querySelector("input").value.trim();if(v){b.name=v.slice(0,60);saveBoards();}showBoards();};
    $("bdel").onclick=()=>{if(!confirm(`Delete "${b.name}" and its ${b.items.length} saved items?`))return;boards=boards.filter(x=>x!==b);saveBoards();b.items.forEach(x=>refreshStars(x.id));showBoards(`Deleted "${b.name}".`);};
    P.querySelectorAll("[data-rm]").forEach(a=>a.onclick=()=>{const [x]=b.items.splice(+a.dataset.rm,1);saveBoards();refreshStars(x.id);showBoards();});
    if($("lrec"))$("lrec").onclick=()=>licenceRecord(b);
    if($("csv"))$("csv").onclick=()=>{
      const head=["title","artist","date","width_px","height_px","licence","rights_statement","licence_checked","source","page","download"];
      const rows=b.items.map(x=>[x.title,x.artist,x.date,x.w,x.h,x.licence,x.rights,x.saved,SRC[x.src]?.name||x.src,x.page,x.download].map(csvCell).join(","));
      download((b.name.replace(/[^\w-]+/g,"-").replace(/^-+|-+$/g,"")||"board")+".csv","﻿"+[head.join(","),...rows].join("\n"),"text/csv;charset=utf-8"); // BOM: Excel reads accents correctly
    };
  }
  $("bexp").onclick=()=>download("print-finder-boards.json",JSON.stringify({version:1,boards},null,1),"application/json");
  $("bimp").onclick=()=>$("bfile").click();
  $("bfile").onchange=async()=>{
    let inc;
    try{const d=JSON.parse(await $("bfile").files[0].text());
      // check and clean everything first, so a bad file changes nothing
      inc=arr(d?.boards).filter(x=>x&&typeof x.name==="string"&&Array.isArray(x.items))
        .map(x=>({name:x.name.slice(0,60),items:[...new Map(x.items.filter(i=>i&&i.id!=null).map(i=>[String(i.id),snap(i)])).values()]}));
      if(!inc.length)throw new Error("no boards found in that file");
    }catch(e){showBoards("Couldn't import: "+e.message);return;}
    // merge: a board with the same name gains the items it lacks; other boards are added
    for(const x of inc){const t=boards.find(y=>y.name===x.name);
      if(t)x.items.forEach(i=>{if(!t.items.some(z=>z.id===i.id))t.items.push(i)});else boards.push({id:newId(),...x});}
    saveBoards();cardCache.forEach((c,id)=>syncStar(c,id));updateBoardsBtn();showBoards(`Imported ${inc.length} board${inc.length>1?"s":""}.`);
  };
  if(!$("panel").open)$("panel").showModal();
}
/* proof-of-licence record for a board: a printable page with the evidence for each image (print it, or save it as PDF) */
function licenceRecord(b){
  const link=(u,t)=>/^https?:/i.test(u)?`<a href="${esc(u)}">${esc(t||u)}</a>`:"—";
  const fmtDay=d=>d?new Date(d+"T12:00:00").toLocaleDateString(undefined,{day:"numeric",month:"long",year:"numeric"}):"not recorded";
  const items=b.items.map(x=>`<div class="item"><img src="${esc(x.thumb)}" alt="" referrerpolicy="no-referrer"><div><b>${esc(x.title)}</b><div class="by">${esc(x.artist||"Unknown")}${x.date?" · "+esc(x.date):""}</div><dl>
    <dt>Source</dt><dd>${esc(SRC[x.src]?.name||x.src)}</dd>
    <dt>Licence</dt><dd>${esc(x.licence||"—")}${SRC[x.src]&&!SRC[x.src].vetted?` <b class="warn">— this source's licence tags vary: check the file page before selling</b>`:""}</dd>
    <dt>Rights statement</dt><dd>${link(x.rights)}</dd>
    <dt>Museum page</dt><dd>${link(x.page)}</dd>
    <dt>Image file</dt><dd>${link(x.download)}</dd>
    <dt>Pixels</dt><dd>${fmtPx(x)}</dd>
    <dt>Licence checked</dt><dd>${fmtDay(x.saved)}</dd></dl></div></div>`).join("");
  const html=`<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Licence record — ${esc(b.name)}</title><style>
body{font:13px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;color:#1d1b18;background:#fff;margin:24px auto;padding:0 16px;max-width:900px}
h1{font:600 21px/1.2 Georgia,serif;margin:0 0 6px}.intro{color:#6f6a61;margin:0 0 14px}
.item{display:grid;grid-template-columns:110px 1fr;gap:16px;padding:14px 0;border-top:1px solid #e3ded3;break-inside:avoid}
img{width:110px;height:110px;object-fit:contain;background:#efebe2}.by{color:#6f6a61}
dl{display:grid;grid-template-columns:130px 1fr;gap:2px 10px;margin:8px 0 0}dt{color:#6f6a61}dd{margin:0;overflow-wrap:anywhere}a{color:#2f5d50}.warn{color:#8a4b12}
button{font:inherit;font-weight:600;background:#2f5d50;color:#fff;border:0;border-radius:8px;padding:8px 16px;margin:0 0 16px;cursor:pointer}
@media print{button{display:none}body{margin:0}}</style></head><body>
<h1>Licence record: ${esc(b.name)}</h1>
<p class="intro">${b.items.length} image${b.items.length>1?"s":""} · made ${fmtDay(today())} with Print Finder. Each image was listed by its source as public domain, CC0 or free of known restrictions on the date shown under “Licence checked”${b.items.some(x=>SRC[x.src]&&!SRC[x.src].vetted)?"; images marked “check the file page” come from a source whose licence tags aren't reliable, so confirm those yourself":""}. Keep this record with your files, and look at the museum page again before a large print run.</p>
<button onclick="print()">Print or save as PDF</button>${items}</body></html>`;
  const url=URL.createObjectURL(new Blob([html],{type:"text/html"}));
  if(!open(url,"_blank"))download(`licence-record-${(b.name.replace(/[^\w-]+/g,"-").replace(/^-+|-+$/g,"")||"board")}.html`,html,"text/html"); // popup blocked: save the page instead
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}
$("boardsbtn").onclick=()=>showBoards();

/* ---------- self-test: one small live search per source, run from the viewer's browser ---------- */
const imgOK=url=>new Promise(res=>{if(!url)return res(false);const i=new Image();i.referrerPolicy="no-referrer";
  const t=setTimeout(()=>res(false),15000);i.onload=()=>{clearTimeout(t);res(true)};i.onerror=()=>{clearTimeout(t);res(false)};i.src=url;});
$("selftest").onclick=async()=>{
  const o={q:"flower",medium:"",from:null,to:null,dpi:150,mode:"contain",sys:"A",lic:"all"};
  $("pbody").innerHTML=`<h2 id="ptitle">Source test</h2><p class="note">One small search for “flower” per source, run from this browser. “Blocked” usually means the museum doesn't allow websites to call its API (CORS).</p><table id="tt">${SOURCES.map(s=>`<tr><td>${esc(s.name)}</td><td id="tt-${s.key}">Testing…</td></tr>`).join("")}</table>`;
  if(!$("panel").open)$("panel").showModal();
  await Promise.all(SOURCES.map(async s=>{
    const cell=()=>$("tt-"+s.key),t0=performance.now();
    try{
      const r=await adapters[s.key](o,0,false,{});
      const secs=((performance.now()-t0)/1000).toFixed(1),it=r.items[0];
      if(!cell())return; // the panel was reused meanwhile
      if(!it){cell().innerHTML=`<span class="b warn">Reached, but 0 results</span> <span class="note">${secs}s</span>`;return;}
      const thumb=await imgOK(it.thumb);
      let iiif="";
      if(it.iiif){try{await getJSON(it.iiif+"/info.json",15000);iiif=' <span class="b ok">size check OK</span>'}catch(e){iiif=` <span class="b warn">size check: ${esc(e.message)}</span>`}}
      if(cell())cell().innerHTML=`<span class="b ok">Works</span> ${r.items.length} results · <span class="note">${secs}s</span>${thumb?"":' <span class="b warn">thumbnail failed</span>'}${iiif}<br><span class="note">e.g. ${esc(it.title)} — ${fmtPx(it)}</span>`;
    }catch(e){if(cell())cell().innerHTML=`<span class="b bad">Failed</span> ${esc(e.message)}`;}
  }));
};
