<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Print Finder</title>
<style>
:root{
  --bg:#f6f4ef;--panel:#fffdf8;--ink:#1d1b18;--muted:#6f6a61;--line:#e3ded3;
  --accent:#2f5d50;--accent-ink:#fff;--ok:#2f7a4a;--ok-bg:#e3f1e7;--warn:#9a6a00;--warn-bg:#fbf0d6;
  --bad:#a33b2b;--bad-bg:#f7e1dc;--chip:#efebe2;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151413;--panel:#1d1c1a;--ink:#ece8df;--muted:#a19b90;--line:#33302b;
  --accent:#7fb8a5;--accent-ink:#10201b;--ok:#86cf9e;--ok-bg:#1f3326;--warn:#e7c06b;--warn-bg:#382e17;
  --bad:#ef9a8a;--bad-bg:#3a201b;--chip:#2a2825;}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
header{padding:20px 20px 0;max-width:1400px;margin:0 auto}
h1{font:600 22px/1.2 Georgia,"Times New Roman",serif;margin:0 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 16px}
.wrap{max-width:1400px;margin:0 auto;padding:0 20px 60px}
form{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
label{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.02em}
input,select,button{font:inherit;color:var(--ink)}
input[type=text],input[type=number],select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:38px}
#q{width:min(420px,100%)}
input[type=number]{width:96px}
.btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:8px;padding:9px 18px;font-weight:600;cursor:pointer;min-height:38px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);border:1px solid transparent;border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--line)}
.srcs{display:flex;flex-wrap:wrap;gap:14px;font-size:13px}
.srcs label{display:flex;align-items:center;gap:6px;color:var(--ink);font-weight:500;letter-spacing:0}
.need{font-size:13px;color:var(--muted)}
.need b{color:var(--ink)}
#status{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0 10px;font-size:13px;color:var(--muted);align-items:center}
.st{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.st.err{color:var(--bad);border-color:var(--bad)}
button.st{font:inherit;font-size:13px;color:var(--ink);cursor:pointer}
button.st:hover{border-color:var(--muted)}
.st.on,.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#tools .chips{align-self:end}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer}
.card:hover{border-color:var(--muted)}
.thumb{aspect-ratio:1/1;background:var(--chip);display:flex;align-items:center;justify-content:center;overflow:hidden}
.thumb img{max-width:100%;max-height:100%;object-fit:contain}
.meta{padding:10px 12px 12px;display:grid;gap:6px;font-size:13px}
.t{font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.a{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badges{display:flex;flex-wrap:wrap;gap:4px}
.b{font-size:11px;font-weight:600;border-radius:5px;padding:2px 6px;background:var(--chip);color:var(--muted)}
.b.ok{background:var(--ok-bg);color:var(--ok)}.b.warn{background:var(--warn-bg);color:var(--warn)}.b.bad{background:var(--bad-bg);color:var(--bad)}
.star{float:right;background:none;border:0;font-size:18px;cursor:pointer;color:var(--muted);line-height:1;padding:0 0 0 6px}
.star.on{color:#d39b1b}
#more{display:block;margin:20px auto}
.empty{color:var(--muted);text-align:center;padding:40px 0}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--ink);padding:0;width:min(1000px,94vw);max-height:92vh}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dlg{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:0}
@media (max-width:760px){.dlg{grid-template-columns:1fr}}
.dimg{background:var(--chip);display:flex;align-items:center;justify-content:center;min-height:300px;max-height:80vh}
.dimg img{max-width:100%;max-height:80vh;object-fit:contain}
.dinfo{padding:18px;display:grid;gap:10px;align-content:start;font-size:14px;overflow:auto;max-height:86vh}
.dinfo h2{font:600 19px/1.25 Georgia,serif;margin:0}
table{border-collapse:collapse;font-size:13px;width:100%}
td{padding:4px 0;border-bottom:1px solid var(--line);vertical-align:top}
td:first-child{color:var(--muted);width:42%}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{color:var(--accent);font-weight:600;font-size:13px}
.crop{width:100%;height:320px;overflow:auto;border:1px solid var(--line);border-radius:8px;background:var(--chip);position:relative}
.crop img{max-width:none;max-height:none;display:block}
.note{font-size:12px;color:var(--muted)}
#shortlist{position:fixed;right:16px;bottom:16px}
.x{position:absolute;right:10px;top:8px;background:var(--panel);border:1px solid var(--line);border-radius:999px;width:32px;height:32px;cursor:pointer;font-size:16px;z-index:2}
</style>
</head>
<body>
<header>
  <h1>Print Finder</h1>
  <p class="sub">Searches 7 open-access collections and keeps only public domain images with enough pixels for your print size.</p>
</header>
<div class="wrap">
<form id="f">
  <div class="row">
    <label>Theme / keywords<input id="q" type="text" placeholder="e.g. botanical, birds, map, woodblock" value="botanical"></label>
    <label>Medium<select id="medium">
      <option value="">Any</option><option value="painting">Painting</option><option value="drawing">Drawing / watercolour</option>
      <option value="print">Print (engraving, woodcut, litho)</option><option value="photograph">Photograph</option></select></label>
    <label>From year<input id="from" type="number" placeholder="1500"></label>
    <label>To year<input id="to" type="number" placeholder="1900"></label>
  </div>
  <div class="row">
    <label>Paper<select id="paper"><option>A3</option><option selected>A2</option><option>A1</option><option>A0</option></select></label>
    <label>Min DPI<select id="dpi"><option value="300">300 (gallery)</option><option value="240">240</option><option value="200" selected>200 (normal viewing)</option><option value="150">150 (bare minimum)</option></select></label>
    <label>Layout<select id="mode"><option value="contain">Whole image, with margins</option><option value="cover">Fill the sheet (crop)</option></select></label>
    <label>Licence<select id="lic"><option value="strict">CC0 museums only</option><option value="all" selected>Include Wikimedia (check licence)</option></select></label>
    <button class="btn" type="submit" id="go">Search</button>
  </div>
  <div class="srcs" id="srcs"></div>
  <details class="note"><summary>Settings</summary><div class="row" style="margin-top:8px"><label>Europeana key — only needed if Europeana starts failing (free from pro.europeana.eu)<input id="eukey" type="text" value="api2demo" style="width:220px"></label><button class="btn ghost" type="button" id="selftest">Test all sources</button></div></details>
  <div class="need" id="need"></div>
</form>
<div id="status"></div>
<div class="row" id="tools" hidden style="margin:0 0 14px">
  <label>Sort<select id="sort"><option value="res">Highest print quality</option><option value="mp">Most pixels</option><option value="early">Earliest first</option><option value="late">Latest first</option><option value="title">Title A–Z</option></select></label>
  <div class="chips" id="orients"><button type="button" class="chip on" data-o="">Any shape</button><button type="button" class="chip" data-o="portrait">Portrait</button><button type="button" class="chip" data-o="landscape">Landscape</button><button type="button" class="chip" data-o="square">Square-ish</button></div>
</div>
<div class="grid" id="grid"></div>
<div class="empty" id="empty" hidden></div>
<button class="btn ghost" id="more" hidden>Search deeper</button>
</div>
<button class="btn" id="shortlist">Shortlist (0)</button>

<dialog id="dlg"><button class="x" id="close" aria-label="Close">✕</button><div id="dbody"></div></dialog>
<dialog id="sdlg"><button class="x" id="sclose" aria-label="Close">✕</button><div class="dinfo" id="sbody"></div></dialog>

<script>
"use strict";
/* ---------- constants ---------- */
const PAPER={A3:[297,420],A2:[420,594],A1:[594,841],A0:[841,1189]}; // mm short,long
const MED={
  painting:{cma:"Painting",aic:"Painting",re:/paint|oil|tempera|maleri|olie/i,kw:"painting"},
  drawing:{cma:"Drawing",aic:"Drawing and Watercolor",re:/draw|watercol|gouache|tegning|akvarel|chalk|pastel/i,kw:"drawing"},
  print:{cma:"Print",aic:"Print",re:/print|engrav|etch|woodcut|woodblock|lithog|mezzotint|aquatint|grafik|kobberstik|træsnit|radering|litografi/i,kw:"print"},
  photograph:{cma:"Photograph",aic:"Photograph",re:/photo|albumen|gelatin|daguerre|cyanotype|fotografi/i,kw:"photograph"}
};
const SOURCES=[
  {key:"rijks",name:"Rijksmuseum",cc0:true},
  {key:"nga",name:"National Gallery of Art (DC)",cc0:true},
  {key:"cma",name:"Cleveland Museum of Art",cc0:true},
  {key:"aic",name:"Art Institute of Chicago",cc0:true},
  {key:"smk",name:"SMK (Denmark)",cc0:true},
  {key:"eu",name:"Europeana (300+ European museums)",cc0:true},
  {key:"wm",name:"Wikimedia Commons",cc0:false}
];
/* Rijksmuseum titles are mostly Dutch: English theme words are also searched as Dutch title words */
const NL={botanical:["plant","planten","bloem","bloemen","tak"],flower:["bloem","bloemen"],flowers:["bloem","bloemen","bloemstilleven"],
  bird:["vogel","vogels"],birds:["vogel","vogels"],butterfly:["vlinder","vlinders"],butterflies:["vlinder","vlinders"],insect:["insect","insecten"],insects:["insect","insecten"],
  map:["kaart","plattegrond"],maps:["kaart","plattegrond"],landscape:["landschap","rivierlandschap"],seascape:["zeegezicht"],sea:["zee","zeegezicht"],ship:["schip","schepen"],ships:["schip","schepen"],
  portrait:["portret"],"still life":["stilleven"],astronomy:["maan","komeet","hemel","sterren"],architecture:["gebouw","kerk","paleis","gevel"],anatomy:["anatomie","skelet","anatomische"],
  "fashion plate":["modeprent","mode"],fashion:["mode","modeprent"],poster:["affiche"],mushroom:["paddenstoel","paddenstoelen"],mushrooms:["paddenstoel","paddenstoelen"],
  shell:["schelp","schelpen"],shells:["schelp","schelpen"],animal:["dier","dieren"],animals:["dier","dieren"],paris:["Parijs"],venice:["Venetië"],garden:["tuin","tuinen"],
  tulip:["tulp","tulpen"],rose:["roos","rozen"],horse:["paard","paarden"],dog:["hond"],cat:["kat"],tree:["boom","bomen"],river:["rivier"],city:["stad","stadsgezicht"],
  winter:["winter","ijs"],fish:["vis","vissen"],fruit:["vruchten","fruit"],woman:["vrouw"],cow:["koe","koeien"],lion:["leeuw"],elephant:["olifant"],monkey:["aap"],
  japanese:["Japan","Japanse"],woodblock:["houtsnede"],"japanese woodblock":["Japan","Japanse"],church:["kerk"],castle:["kasteel"],windmill:["molen"],moon:["maan"]};
const RIJKS_TYPE={painting:"painting",drawing:"drawing",print:"print",photograph:"photograph"};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const strip=s=>{const d=document.createElement("div");d.innerHTML=s||"";return d.textContent.trim();};
const yearOf=s=>{const m=String(s??"").match(/(1[0-9]{3}|20[0-2][0-9])/);return m?+m[1]:null;};

/* ---------- storage (per-browser convenience only) ---------- */
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let shortlist=store.get("pf_shortlist",[]);

/* ---------- UI setup ---------- */
SOURCES.forEach(s=>{const l=document.createElement("label");l.innerHTML=`<input type="checkbox" value="${s.key}" checked> ${esc(s.name)}${s.cc0?"":" <span class='b warn'>licence varies</span>"}`;$("srcs").appendChild(l)});
const saved=store.get("pf_form",null);
if(saved)for(const[k,v]of Object.entries(saved)){if($(k))$(k).value=v}

function opts(){
  const [ps,pl]=PAPER[$("paper").value], dpi=+$("dpi").value;
  const lic=$("lic").value;
  const srcs=[...$("srcs").querySelectorAll("input:checked")].map(i=>i.value).filter(k=>lic==="all"||k!=="wm");
  return {q:$("q").value.trim(),medium:$("medium").value,from:$("from").value?+$("from").value:null,to:$("to").value?+$("to").value:null,
    paper:$("paper").value,dpi,mode:$("mode").value,srcs,
    needS:Math.round(ps/25.4*dpi),needL:Math.round(pl/25.4*dpi),psIn:ps/25.4,plIn:pl/25.4};
}
function showNeed(){const o=opts();$("need").innerHTML=o.mode==="contain"
  ?`${o.paper} at ${o.dpi} dpi: the image needs <b>${o.needL.toLocaleString()} px on its long side</b> or <b>${o.needS.toLocaleString()} px on its short side</b>`
  :`${o.paper} at ${o.dpi} dpi: the image needs at least <b>${o.needS.toLocaleString()} × ${o.needL.toLocaleString()} px</b> to fill the sheet`;}
["paper","dpi","mode"].forEach(id=>$(id).addEventListener("change",()=>{showNeed();if(results.length){view.limit=PAGE;rerender();topUp()}}));
showNeed();

/* ---------- print maths ---------- */
function fit(it,o){
  const L=Math.max(it.w,it.h), S=Math.min(it.w,it.h);
  // whole image printed as large as fits on the sheet → dpi set by the tighter side
  const effContain=Math.max(L/o.plIn,S/o.psIn);
  // image scaled to cover the whole sheet (cropping the excess)
  const effCover=Math.min(L/o.plIn,S/o.psIn);
  const eff=o.mode==="cover"?effCover:effContain;
  const ar=L/S, par=o.plIn/o.psIn;
  const crop=Math.round((1-Math.min(ar,par)/Math.max(ar,par))*100); // % lost when filling the sheet
  const maxL=L/o.dpi*2.54, maxS=S/o.dpi*2.54; // cm at chosen dpi
  return {eff:Math.round(eff),pass:eff>=o.dpi,crop,maxL,maxS};
}
function orientOf(it){const r=it.w/it.h;return r>1.08?"landscape":r<0.92?"portrait":"square";}

/* ---------- source adapters: each returns {items, more} ---------- */
async function getJSON(url,ms=20000){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
  try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw new Error("HTTP "+r.status);return await r.json();}
  catch(e){throw new Error(e.name==="AbortError"?"timeout":e.message==="Failed to fetch"?"blocked or offline":e.message)}
  finally{clearTimeout(t)}
}
async function pool(list,n,fn){const out=[];let i=0;
  await Promise.all(Array.from({length:Math.min(n,list.length)},async()=>{while(i<list.length){const j=i++;try{out[j]=await fn(list[j])}catch(e){out[j]=null}}}));
  return out;}
const arr=x=>x==null?[]:Array.isArray(x)?x:[x];
const EN="300388277";
const isEn=o=>arr(o.language).some(l=>String(l.id||"").endsWith(EN));
const notation=(n,lang="en")=>{const a=arr(n);return (a.find(x=>x["@language"]===lang)||a[0]||{})["@value"]||"";};
const rijksData=id=>String(id).replace("https://id.rijksmuseum.nl/","https://data.rijksmuseum.nl/")+"?_profile=la-framed";
let ngaLoading=null;
function loadNGA(){
  if(window.NGA_INDEX)return Promise.resolve();
  return ngaLoading||(ngaLoading=fetch("nga-index.json").then(r=>{if(!r.ok)throw new Error("nga-index.json missing");return r.json()}).then(d=>{window.NGA_INDEX=d}).catch(e=>{ngaLoading=null;throw e}));
}

const adapters={
  async cma(o,page){
    const p=new URLSearchParams({cc0:"1",has_image:"1",limit:"100",skip:String(page*100)});
    if(o.q)p.set("q",o.q);
    if(o.medium)p.set("type",MED[o.medium].cma);
    if(o.from!=null)p.set("created_after",o.from);
    if(o.to!=null)p.set("created_before",o.to);
    const d=await getJSON("https://openaccess-api.clevelandart.org/api/artworks/?"+p);
    const items=(d.data||[]).filter(a=>a.images&&(a.images.full||a.images.print)).map(a=>{
      const full=a.images.full||a.images.print;
      return {id:"cma-"+a.id,src:"cma",title:a.title,artist:(a.creators&&a.creators[0]&&a.creators[0].description)||a.culture?.[0]||"",
        year:a.creation_date_earliest??yearOf(a.creation_date),date:a.creation_date||"",medium:[a.type,a.technique].filter(Boolean).join(" · "),
        w:+full.width,h:+full.height,thumb:a.images.web?.url,preview:a.images.print?.url||a.images.web?.url,
        page:a.url,download:full.url,downloadAlt:a.images.print?.url,licence:a.share_license_status||"CC0",licOk:true};
    });
    return {items,more:(page+1)*100<(d.info?.total||0)};
  },
  async aic(o,page,noSize){
    const filter=[{term:{is_public_domain:true}},{exists:{field:"image_id"}}];
    if(o.medium)filter.push({match:{artwork_type_title:MED[o.medium].aic}});
    if(o.from!=null)filter.push({range:{date_end:{gte:o.from}}});
    if(o.to!=null)filter.push({range:{date_start:{lte:o.to}}});
    if(!noSize)filter.push({bool:{should:[{range:{"thumbnail.width":{gte:o.needS}}},{range:{"thumbnail.height":{gte:o.needS}}}],minimum_should_match:1}});
    const params={limit:100,page:page+1,fields:["id","title","image_id","thumbnail","date_start","date_end","date_display","medium_display","artwork_type_title","artist_title"],query:{bool:{filter}}};
    if(o.q)params.q=o.q;
    let d;
    try{d=await getJSON("https://api.artic.edu/api/v1/artworks/search?params="+encodeURIComponent(JSON.stringify(params)));}
    catch(e){if(!noSize)return adapters.aic(o,page,true);throw e;}
    const iiif=d.config?.iiif_url||"https://www.artic.edu/iiif/2";
    const items=(d.data||[]).filter(a=>a.image_id&&a.thumbnail?.width).map(a=>({
      id:"aic-"+a.id,src:"aic",title:a.title,artist:a.artist_title||"",year:a.date_start,date:a.date_display||"",
      medium:[a.artwork_type_title,a.medium_display].filter(Boolean).join(" · "),w:a.thumbnail.width,h:a.thumbnail.height,
      thumb:`${iiif}/${a.image_id}/full/400,/0/default.jpg`,preview:`${iiif}/${a.image_id}/full/843,/0/default.jpg`,
      iiif:`${iiif}/${a.image_id}`,page:`https://www.artic.edu/artworks/${a.id}`,download:`${iiif}/${a.image_id}/full/full/0/default.jpg`,
      licence:"CC0",licOk:true,sizeNote:"Size is the museum's master file; the download server may cap it — use \"Check downloadable size\"."}));
    return {items,more:(d.pagination?.current_page||0)<(d.pagination?.total_pages||0)};
  },
  async smk(o,page){
    let keys=o.q||"*";
    const p=new URLSearchParams({keys,offset:String(page*100),rows:"100",lang:"en"});
    const url="https://api.smk.dk/api/v1/art/search/?"+p+"&filters=[public_domain:true],[has_image:true]";
    const d=await getJSON(url);
    const items=(d.items||[]).filter(a=>a.image_width&&a.image_height).map(a=>{
      const t=(a.titles||[]).find(x=>/eng/i.test(x.language||""))||(a.titles||[])[0]||{};
      const pd=(a.production_date||[])[0]||{};
      return {id:"smk-"+a.object_number,src:"smk",title:t.title||a.object_number,artist:(a.production||[]).map(x=>x.creator).filter(Boolean).join(", "),
        year:yearOf(pd.start),date:pd.period||"",medium:[...(a.object_names||[]).map(x=>x.name),...(a.techniques||[])].join(" · "),
        w:a.image_width,h:a.image_height,thumb:a.image_thumbnail,preview:a.image_iiif_id?a.image_iiif_id+"/full/!1200,/0/default.jpg":a.image_thumbnail,
        iiif:a.image_iiif_id,page:a.frontend_url,download:a.image_native,licence:"Public domain (CC0 / PDM)",licOk:true,clientMedium:true,clientEra:true};
    });
    return {items,more:(page+1)*100<(d.found||0)};
  },
  async wm(o,page,_,state){
    let q=o.q||"art";
    if(o.medium)q+=" "+MED[o.medium].kw;
    q+=" filesize:>2500";
    q+=" filetype:bitmap";
    const p=new URLSearchParams({action:"query",format:"json",origin:"*",generator:"search",gsrnamespace:"6",gsrlimit:"50",gsroffset:String(state.offset||0),gsrsearch:q,
      prop:"imageinfo",iiprop:"url|size|extmetadata",iiurlwidth:"480",iiextmetadatafilter:"LicenseShortName|DateTimeOriginal|Artist|ObjectName|ImageDescription"});
    const d=await getJSON("https://commons.wikimedia.org/w/api.php?"+p);
    state.offset=d.continue?.gsroffset;
    const pages=Object.values(d.query?.pages||{}).sort((a,b)=>(a.index||0)-(b.index||0));
    const items=pages.filter(pg=>pg.imageinfo?.[0]).map(pg=>{
      const ii=pg.imageinfo[0], m=ii.extmetadata||{};const lic=strip(m.LicenseShortName?.value)||"Unknown";
      const dt=strip(m.DateTimeOriginal?.value);
      return {id:"wm-"+pg.pageid,src:"wm",title:strip(m.ObjectName?.value)||pg.title.replace(/^File:/,"").replace(/\.[a-z]+$/i,""),artist:strip(m.Artist?.value),
        year:yearOf(dt),date:dt,medium:"",w:ii.width,h:ii.height,thumb:ii.thumburl,preview:ii.thumburl?.replace(/\/\d+px-/,"/1200px-"),page:ii.descriptionurl,download:ii.url,
        licence:lic,licOk:/public domain|^pd|cc0|cc-zero/i.test(lic),clientEra:true};
    }).filter(it=>it.licOk);
    return {items,more:!!d.continue};
  },

  /* Rijksmuseum: search returns IDs only; each is resolved object → visual item → digital object → IIIF info.json */
  async rijks(o,page,_,st){
    if(!st.streams){
      const base={imageAvailable:"true"};
      if(o.medium)base.type=RIJKS_TYPE[o.medium];
      if(o.from!=null&&o.to!=null&&Math.floor(o.from/100)===Math.floor(o.to/100))base.creationDate=Math.floor(o.from/100)+"??";
      const q=o.q.toLowerCase().trim();const terms=new Set();
      if(q){ (NL[q]||[]).forEach(t=>terms.add(t)); q.split(/\s+/).forEach(w=>(NL[w]||[]).forEach(t=>terms.add(t))); terms.add(o.q); }
      st.streams=q?[...[...terms].map(t=>({...base,title:t})),{...base,description:o.q}]:[base];
      st.streams=st.streams.map(p=>({url:"https://data.rijksmuseum.nl/search/collection?"+new URLSearchParams(p)}));
      st.buf=[];st.ids=new Set();st.okOnce=false;
    }
    // fill the buffer of object IDs
    while(st.buf.length<12&&st.streams.some(s=>s.url)){
      const s=st.streams.find(s=>s.url);
      try{const d=await getJSON(s.url);st.okOnce=true;
        arr(d.orderedItems).forEach(x=>{if(x.id&&!st.ids.has(x.id)){st.ids.add(x.id);st.buf.push(x.id)}});
        s.url=d.next?.id||(typeof d.next==="string"?d.next:null);
      }catch(e){if(!st.okOnce)throw e;s.url=null;}
    }
    const batch=st.buf.splice(0,12);
    const items=(await pool(batch,6,async id=>{
      const ob=await getJSON(rijksData(id));
      const vi=arr(ob.shows)[0];if(!vi)return null;
      const v=await getJSON(rijksData(vi.id));
      const rights=arr(v.subject_to).flatMap(r=>arr(r.classified_as)).map(c=>c.id||"").join(" ");
      if(rights&&!/publicdomain/.test(rights))return null;
      const dobj=arr(v.digitally_shown_by)[0];if(!dobj)return null;
      const dg=await getJSON(rijksData(dobj.id));
      const ap=arr(dg.access_point).map(a=>a.id).find(x=>/iiif\.micr\.io\//.test(x||""));if(!ap)return null;
      const mid=ap.match(/iiif\.micr\.io\/([^/]+)/)[1],iiif="https://iiif.micr.io/"+mid;
      const info=await getJSON(iiif+"/info.json");
      const names=arr(ob.identified_by).filter(x=>x.type==="Name");
      const title=(names.find(isEn)||names[0]||{}).content||"Untitled";
      const objNo=(arr(ob.identified_by).find(x=>x.type==="Identifier")||{}).content||"";
      const pr=ob.produced_by||{};
      const cre=(arr(pr.referred_to_by).find(isEn)||arr(pr.referred_to_by)[0]||{}).content||
        arr(pr.part).flatMap(p=>arr(p.carried_out_by)).map(a=>notation(a.notation)).filter(Boolean).join(", ");
      const ts=pr.timespan||{};
      const dateTxt=(arr(ts.identified_by).find(isEn)||arr(ts.identified_by)[0]||{}).content||"";
      const med=[...arr(ob.classified_as).map(c=>notation(c.notation)),...arr(pr.technique).map(c=>notation(c.notation))].filter(Boolean);
      const pageUrl=arr(ob.subject_of).flatMap(s=>arr(s.digitally_carried_by)).flatMap(d=>arr(d.access_point)).map(a=>a.id).find(Boolean)
        ||("https://www.rijksmuseum.nl/en/collection/"+objNo);
      return {id:"rijks-"+id.split("/").pop(),src:"rijks",title,artist:cre,year:yearOf(ts.begin_of_the_begin),date:dateTxt,medium:[...new Set(med)].join(" · "),
        w:info.width,h:info.height,thumb:iiif+"/full/400,/0/default.jpg",preview:iiif+"/full/1200,/0/default.jpg",iiif,page:pageUrl,
        download:iiif+"/full/max/0/default.jpg",licence:/zero/.test(rights)?"CC0":"Public domain",licOk:true,clientEra:true};
    })).filter(Boolean);
    return {items,more:st.buf.length>0||st.streams.some(s=>s.url)};
  },

  /* National Gallery of Art: searched locally from the open-data index (nga-index.js) */
  async nga(o,page,_,st){
    await loadNGA();
    if(!st.list){
      const words=o.q.toLowerCase().split(/\s+/).filter(Boolean);
      const cls={painting:"p",drawing:"d",print:"r",photograph:"f"}[o.medium];
      st.list=window.NGA_INDEX.filter(r=>{
        if(cls&&r[8]!==cls)return false;
        if(o.from!=null&&(r[7]??r[6]??-1e9)<o.from)return false;
        if(o.to!=null&&(r[6]??1e9)>o.to)return false;
        if(!words.length)return true;
        const hay=(r[3]+" "+r[4]+" "+r[9]+" "+r[10]).toLowerCase();
        return words.every(w=>hay.includes(w));
      });
    }
    const slice=page?[]:st.list;
    const iiif=u=>"https://api.nga.gov/iiif/"+u;
    const items=slice.map(r=>({id:"nga-"+r[11],src:"nga",title:r[3],artist:r[4],year:r[6],date:r[5],medium:r[9],w:r[1],h:r[2],
      thumb:iiif(r[0])+"/full/!400,400/0/default.jpg",preview:iiif(r[0])+"/full/!1200,1200/0/default.jpg",iiif:iiif(r[0]),
      page:"https://www.nga.gov/collection/art-object-page."+r[11]+".html",download:iiif(r[0])+"/full/max/0/default.jpg",licence:"CC0",licOk:true}));
    return {items,more:false};
  },

  /* Europeana: aggregator. Search pre-filters to >4 MP open images; exact pixel size comes from each record */
  async eu(o,page,_,st){
    const key=$("eukey").value.trim()||"api2demo";
    const p=new URLSearchParams({wskey:key,query:(o.q||"*")+(o.medium?" "+MED[o.medium].kw:""),rows:"24",cursor:st.cursor||"*",media:"true",reusability:"open",profile:"rich"});
    p.append("qf","TYPE:IMAGE");p.append("qf","IMAGE_SIZE:extra_large");
    if(o.from!=null||o.to!=null)p.append("qf",`YEAR:[${o.from??0} TO ${o.to??2100}]`);
    const d=await getJSON("https://api.europeana.eu/record/v2/search.json?"+p);
    st.cursor=d.nextCursor;
    const cand=(d.items||[]).filter(it=>arr(it.rights).some(r=>/publicdomain/.test(r)));
    const items=(await pool(cand,5,async it=>{
      const r=await getJSON(`https://api.europeana.eu/record/v2${it.id}.json?wskey=${encodeURIComponent(key)}`);
      const ag=arr(r.object?.aggregations)[0]||{};
      const shown=ag.edmIsShownBy;
      const wr=arr(ag.webResources).filter(w=>w.ebucoreWidth&&w.ebucoreHeight);
      const best=wr.find(w=>w.about===shown)||wr.sort((a,b)=>b.ebucoreWidth*b.ebucoreHeight-a.ebucoreWidth*a.ebucoreHeight)[0];
      if(!best)return null;
      const prov=arr(it.dataProvider)[0]||"";
      const lic=arr(it.rights)[0]||"";
      return {id:"eu-"+it.id,src:"eu",title:arr(it.title)[0]||"Untitled",artist:arr(it.dcCreator)[0]||"",year:yearOf(arr(it.year)[0]),date:arr(it.year)[0]||"",
        medium:prov?"via "+prov:"",w:+best.ebucoreWidth,h:+best.ebucoreHeight,thumb:arr(it.edmPreview)[0],preview:arr(it.edmPreview)[0],
        page:ag.edmIsShownAt||it.guid,download:best.about,licence:/zero/.test(lic)?"CC0":"Public domain mark",licOk:true,clientEra:true,provider:prov};
    })).filter(Boolean);
    return {items,more:!!d.nextCursor&&(d.items||[]).length>0};
  }
};

/* ---------- search engine ---------- */
const PAGE=12;
let results=[],seen=new Set(),state={},runId=0;
let view={src:new Set(),orient:"",sort:"res",limit:PAGE};
function keep(it,o){
  if(!(it.w>0&&it.h>0))return false;
  if(!fit(it,o).pass)return false;
  if(it.clientMedium&&o.medium&&!MED[o.medium].re.test(it.medium))return false;
  if(it.clientEra&&(o.from!=null||o.to!=null)){
    if(it.year==null)return it.src==="wm";
    if(o.from!=null&&it.year<o.from)return false;
    if(o.to!=null&&it.year>o.to)return false;
  }
  return true;
}
const printable=o=>results.filter(it=>keep(it,o));
function visible(o){
  let l=printable(o);
  if(view.src.size)l=l.filter(it=>view.src.has(it.src));
  if(view.orient)l=l.filter(it=>orientOf(it)===view.orient);
  const yr=(it,dir)=>it.year??(dir>0?1e9:-1e9);
  const by={res:(a,b)=>fit(b,o).eff-fit(a,o).eff,
    early:(a,b)=>yr(a,1)-yr(b,1),late:(a,b)=>yr(b,-1)-yr(a,-1),
    title:(a,b)=>String(a.title).localeCompare(String(b.title)),
    mp:(a,b)=>b.w*b.h-a.w*a.h}[view.sort];
  return l.sort(by);
}
function statusLine(){
  const o=opts(),all=printable(o);
  const busy=o.srcs.some(k=>state[k]?.busy);
  const n=k=>all.filter(it=>it.src===k).length;
  $("status").innerHTML=`<button type="button" class="st f ${view.src.size?"":"on"}" data-src="">All sources · ${all.length}</button>`+
    o.srcs.map(k=>{const s=state[k]||{};const name=SOURCES.find(x=>x.key===k).name.replace(/ \(300\+.*\)/,"");
      if(s.err)return `<span class="st err" title="${esc(s.err)}">${esc(name)}: failed (${esc(s.err)})</span>`;
      return `<button type="button" class="st f ${view.src.has(k)?"on":""}" data-src="${k}">${esc(name)} · ${n(k)}${s.busy?" …":""}</button>`}).join("")+
    (busy?`<span class="note">searching…</span>`:"");
  $("status").querySelectorAll("button[data-src]").forEach(b=>b.onclick=()=>{
    const k=b.dataset.src;
    if(!k)view.src.clear();else view.src.has(k)?view.src.delete(k):view.src.add(k);
    view.limit=PAGE;rerender();topUp();
  });
}
/* each source pages independently, so fast sources show results straight away */
async function sourceLoop(k,id,o){
  const s=state[k];
  while(id===runId&&s.more&&!s.err&&s.rounds<4&&visible(o).length<view.limit+PAGE){
    s.busy=true;s.rounds++;statusLine();
    try{
      const r=await adapters[k](o,s.page,false,s);if(id!==runId)return;
      s.page++;s.more=!!r.more;
      for(const it of r.items){if(seen.has(it.id))continue;seen.add(it.id);results.push(it);}
    }catch(e){if(id!==runId)return;s.err=e.message||"network";s.more=false;}
    s.busy=false;scheduleRender();
  }
  s.busy=false;scheduleRender();
}
function topUp(){
  const o=opts(),id=runId;
  if(visible(o).length>=view.limit+PAGE)return;
  o.srcs.filter(k=>state[k]&&!state[k].busy&&state[k].more&&!state[k].err&&(!view.src.size||view.src.has(k)))
    .forEach(k=>{state[k].rounds=0;sourceLoop(k,id,o)});
}
let rq=0;function scheduleRender(){if(!rq)rq=requestAnimationFrame(()=>{rq=0;rerender()})}
function run(){
  const o=opts();store.set("pf_form",{q:o.q,medium:o.medium,from:$("from").value,to:$("to").value,paper:o.paper,dpi:String(o.dpi),mode:o.mode,lic:$("lic").value,eukey:$("eukey").value});
  showNeed();runId++;results=[];seen=new Set();state={};view.src.clear();view.limit=PAGE;
  o.srcs.forEach(k=>state[k]={page:0,more:true,rounds:0});
  $("grid").innerHTML="";$("more").hidden=true;$("tools").hidden=false;
  if(!o.srcs.length){$("empty").hidden=false;$("empty").textContent="Pick at least one source.";return;}
  rerender();
  o.srcs.forEach(k=>sourceLoop(k,runId,o));
}
$("f").addEventListener("submit",e=>{e.preventDefault();run()});
$("more").onclick=()=>{view.limit+=PAGE;rerender();topUp();};
$("sort").onchange=()=>{view.sort=$("sort").value;rerender()};
$("orients").querySelectorAll("button").forEach(b=>b.onclick=()=>{view.orient=b.dataset.o;view.limit=PAGE;
  $("orients").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));rerender();topUp();});

/* ---------- rendering ---------- */
function badgeHTML(it,o){
  const f=fit(it,o);const src=SOURCES.find(s=>s.key===it.src);
  return `<span class="b ${f.pass?"ok":"bad"}">${f.eff} dpi at ${o.paper}</span>`+
    `<span class="b">${it.w.toLocaleString()}×${it.h.toLocaleString()}</span>`+
    (o.mode==="cover"&&f.crop>3?`<span class="b warn">${f.crop}% crop</span>`:"")+
    (o.mode==="contain"&&f.crop>25?`<span class="b warn">fills ${100-f.crop}% of sheet</span>`:"")+
    `<span class="b ${src.cc0?"ok":"warn"}">${src.cc0?"CC0":esc(it.licence)}</span>`;
}
function card(it,o){
  const on=shortlist.some(s=>s.id===it.id);
  const src=SOURCES.find(s=>s.key===it.src);
  const d=document.createElement("div");d.className="card";d.dataset.id=it.id;
  d.innerHTML=`<div class="thumb"><img loading="lazy" alt="" src="${esc(it.thumb||"")}" referrerpolicy="no-referrer"></div>
  <div class="meta"><div class="t"><button class="star ${on?"on":""}" title="Shortlist">${on?"★":"☆"}</button>${esc(it.title)}</div>
  <div class="a">${esc(it.artist||"Unknown")}${it.date?" · "+esc(it.date):""}</div>
  <div class="a">${esc(it.provider||src.name.replace(/ \(300\+.*\)/,""))}</div>
  <div class="badges">${badgeHTML(it,o)}</div></div>`;
  d.querySelector(".star").onclick=e=>{e.stopPropagation();toggleShort(it);};
  d.onclick=()=>openDetail(it);
  return d;
}
const cardCache=new Map();
function rerender(){
  const o=opts();const g=$("grid");
  const list=visible(o),shown=list.slice(0,view.limit);
  const frag=document.createDocumentFragment();
  shown.forEach(it=>frag.appendChild(card(it,o)));
  g.replaceChildren(frag);
  const busy=o.srcs.some(k=>state[k]?.busy), canFetch=o.srcs.some(k=>state[k]?.more&&!state[k]?.err);
  $("more").hidden=!(list.length>view.limit||canFetch);
  $("more").textContent=list.length>view.limit?`Load ${Math.min(PAGE,list.length-view.limit)} more`:busy?"Searching…":"Search deeper";
  $("more").disabled=list.length<=view.limit&&busy;
  $("empty").hidden=shown.length>0;
  if(!shown.length)$("empty").textContent=busy||!results.length&&canFetch?"Searching…":"Nothing printable here. Try a lower DPI, a smaller paper size, broader keywords or another source.";
  statusLine();
}

/* ---------- detail ---------- */
function openDetail(it){
  const o=opts(),f=fit(it,o),src=SOURCES.find(s=>s.key===it.src);
  $("dbody").innerHTML=`<div class="dlg"><div class="dimg"><img src="${esc(it.preview||it.thumb)}" alt="" referrerpolicy="no-referrer"></div>
  <div class="dinfo"><h2>${esc(it.title)}</h2><div class="a">${esc(it.artist||"Unknown")}</div>
  <table>
   <tr><td>Date</td><td>${esc(it.date||"—")}</td></tr>
   <tr><td>Medium</td><td>${esc(it.medium||"—")}</td></tr>
   <tr><td>Source</td><td>${esc(src.name)}${it.provider?" — "+esc(it.provider):""}</td></tr>
   <tr><td>Licence</td><td>${esc(it.licence)}${src.cc0?"":" — <b>check the file page before selling</b>"}</td></tr>
   <tr><td>Pixels</td><td>${it.w.toLocaleString()} × ${it.h.toLocaleString()} (${(it.w*it.h/1e6).toFixed(1)} MP)</td></tr>
   <tr><td>At ${o.paper}</td><td>${f.eff} dpi (${o.mode==="cover"?"filling sheet":"whole image"})</td></tr>
   <tr><td>Crop to fill ${o.paper}</td><td>${f.crop}%</td></tr>
   <tr><td>Max size at ${o.dpi} dpi</td><td>${f.maxL.toFixed(0)} × ${f.maxS.toFixed(0)} cm</td></tr>
   <tr><td>Downloadable</td><td id="dl">${it.iiif?'<button class="btn ghost" id="chk" type="button">Check downloadable size</button>':"Full file from source"}</td></tr>
  </table>
  ${it.sizeNote?`<div class="note">${esc(it.sizeNote)}</div>`:""}
  <div class="links"><a href="${esc(it.page)}" target="_blank" rel="noopener">Museum page ↗</a><a href="${esc(it.download)}" target="_blank" rel="noopener">Full-size file ↗</a>${it.downloadAlt?`<a href="${esc(it.downloadAlt)}" target="_blank" rel="noopener">JPEG version ↗</a>`:""}</div>
  <button class="btn ghost" id="pix" type="button">View 100% detail (pixel-peep)</button>
  <div id="cropbox"></div>
  <button class="btn" id="sl" type="button">${shortlist.some(s=>s.id===it.id)?"Remove from shortlist":"Add to shortlist"}</button>
  </div></div>`;
  $("sl").onclick=()=>{toggleShort(it);$("sl").textContent=shortlist.some(s=>s.id===it.id)?"Remove from shortlist":"Add to shortlist"};
  if($("chk"))$("chk").onclick=async()=>{
    $("dl").textContent="Checking…";
    try{const d=await getJSON(it.iiif+"/info.json");
      const mw=d.maxWidth||d.profile?.[1]?.maxWidth, mh=d.maxHeight||d.profile?.[1]?.maxHeight, ma=d.maxArea||d.profile?.[1]?.maxArea;
      let w=d.width,h=d.height;
      if(mw&&w>mw){h=Math.round(h*mw/w);w=mw}
      if(mh&&h>mh){w=Math.round(w*mh/h);h=mh}
      if(ma&&w*h>ma){const s=Math.sqrt(ma/(w*h));w=Math.floor(w*s);h=Math.floor(h*s)}
      const g=fit({w,h},o);
      $("dl").innerHTML=`${w.toLocaleString()} × ${h.toLocaleString()} → <span class="b ${g.pass?"ok":"bad"}">${g.eff} dpi at ${o.paper}</span>`;
    }catch(e){$("dl").textContent="Couldn't check ("+e.message+")";}
  };
  $("pix").onclick=()=>{
    const box=$("cropbox");let url=null;
    if(it.iiif){const cw=1000,ch=700,x=Math.max(0,Math.round(it.w/2-cw/2)),y=Math.max(0,Math.round(it.h/2-ch/2));url=`${it.iiif}/${x},${y},${cw},${ch}/full/0/default.jpg`;}
    else if(it.src==="wm"&&/\.(jpe?g|png)$/i.test(it.download))url=it.download;
    else if(it.src==="cma"&&it.downloadAlt){box.innerHTML='<div class="note">Cleveland\'s full file is a TIFF (not viewable in a browser). Open the JPEG version and zoom in instead.</div>';return;}
    if(!url){box.innerHTML='<div class="note">No 100% view available for this source.</div>';return;}
    box.innerHTML=`<div class="crop" id="cr"><img src="${esc(url)}" alt="" referrerpolicy="no-referrer"></div><div class="note">Actual pixels from the centre of the image. At ${o.dpi} dpi, ${o.dpi} of these pixels = 1 inch of print. Look for blur, JPEG blocks and halftone dots.</div>`;
    const img=box.querySelector("img");img.onload=()=>{const c=$("cr");if(!it.iiif){c.scrollLeft=(img.naturalWidth-c.clientWidth)/2;c.scrollTop=(img.naturalHeight-c.clientHeight)/2;}};
    img.onerror=()=>{box.innerHTML='<div class="note">The server refused the detail crop — open the full-size file instead.</div>'};
  };
  $("dlg").showModal();
}
$("close").onclick=()=>$("dlg").close();
$("dlg").addEventListener("click",e=>{if(e.target===$("dlg"))$("dlg").close()});

/* ---------- self-test: one small live search per source, run from the viewer's browser ---------- */
const imgOK=url=>new Promise(res=>{if(!url)return res(false);const i=new Image();i.referrerPolicy="no-referrer";
  const t=setTimeout(()=>res(false),15000);i.onload=()=>{clearTimeout(t);res(true)};i.onerror=()=>{clearTimeout(t);res(false)};i.src=url;});
$("selftest").onclick=async()=>{
  const o={q:"flower",medium:"",from:null,to:null,paper:"A3",dpi:150,mode:"contain",needS:1754,needL:2480,psIn:297/25.4,plIn:420/25.4};
  $("sbody").innerHTML=`<h2>Source test</h2><p class="note">One small search for “flower” per source, run from this browser. “Blocked” usually means the museum doesn't allow websites to call its API (CORS).</p><table id="tt">${SOURCES.map(s=>`<tr><td>${esc(s.name)}</td><td id="tt-${s.key}">Testing…</td></tr>`).join("")}</table>`;
  if(!$("sdlg").open)$("sdlg").showModal();
  await Promise.all(SOURCES.map(async s=>{
    const cell=()=>$("tt-"+s.key);const t0=performance.now();
    try{
      const r=await adapters[s.key](o,0,false,{});
      const secs=((performance.now()-t0)/1000).toFixed(1);
      const it=r.items[0];
      if(!it){cell().innerHTML=`<span class="b warn">Reached, but 0 results</span> <span class="note">${secs}s</span>`;return;}
      const thumb=await imgOK(it.thumb);
      let iiif="";
      if(it.iiif){try{await getJSON(it.iiif+"/info.json",15000);iiif=' <span class="b ok">size check OK</span>'}catch(e){iiif=` <span class="b warn">size check: ${esc(e.message)}</span>`}}
      cell().innerHTML=`<span class="b ok">Works</span> ${r.items.length} results · <span class="note">${secs}s</span>${thumb?"":' <span class="b warn">thumbnail failed</span>'}${iiif}<br><span class="note">e.g. ${esc(it.title)} — ${it.w}×${it.h}</span>`;
    }catch(e){cell().innerHTML=`<span class="b bad">Failed</span> ${esc(e.message)}`;}
  }));
};
</script>
</body>
</html>
